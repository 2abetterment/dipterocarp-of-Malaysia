// Simple BM translation for data field values
function tval(v, lang) {
  if (lang === 'en' || !v) return v;
  const map = {
    'Vulnerable':'Terancam','Endangered':'Terancam (EN)','Critically Endangered':'Terancam Kritikal',
    'Near Threatened':'Hampir Terancam','Least Concern':'Kurang Bimbang',
    'Data Deficient':'Data Tidak Mencukupi','Not Evaluated':'Tidak Dinilai',
    'Lowland forest':'Hutan tanah rendah','Lowland dipterocarp forest':'Hutan dipterokarp tanah rendah',
    'Hill dipterocarp forest':'Hutan bukit dipterokarpa','Hill forest':'Hutan bukit',
    'Mixed dipterocarp forest':'Hutan dipterokarp campuran','Primary forest':'Hutan primer',
    'Secondary forest':'Hutan sekunder','Peat swamp forest':'Hutan paya gambut',
    'Riparian forest':'Hutan tepi sungai','Montane forest':'Hutan tanah tinggi',
    'Peninsular Malaysia':'Semenanjung Malaysia',
    'Mass flowering':'Berbunga massa','Mast flowering':'Berbunga serentak',
    'Irregular':'Tidak teratur','Annual':'Tahunan',
    'Logging':'Pembalakan','Forest conversion':'Penukaran hutan','Deforestation':'Penyahutanan',
    'Fragmentation':'Fragmentasi','Agriculture':'Pertanian','Climate change':'Perubahan iklim',
    'Emergent canopy tree':'Pokok kanopi timbul','Canopy tree':'Pokok kanopi',
    'Sub-canopy tree':'Pokok sub-kanopi','Hardwood':'Kayu keras','Timber':'Kayu balak',
    'Construction':'Pembinaan','Furniture':'Perabot','Plywood':'Papan lapis',
  };
  if (map[v]) return map[v];
  let r = v;
  for (const [en,bm] of Object.entries(map)) {
    r = r.replace(new RegExp('\\b'+en+'\\b','gi'), bm);
  }
  return r;
}

// ─── IUCN ─────────────────────────────────────────────────
const IUCN_MAP = {
  CR:{label:'Critically Endangered',c:'#B91C1C',bg:'#FEE2E2'},
  EN:{label:'Endangered',c:'#C2410C',bg:'#FFEDD5'},
  VU:{label:'Vulnerable',c:'#A16207',bg:'#FEF3C7'},
  NT:{label:'Near Threatened',c:'#65A30D',bg:'#ECFCCB'},
  LC:{label:'Least Concern',c:'#047857',bg:'#D1FAE5'},
  DD:{label:'Data Deficient',c:'#525252',bg:'#F4F4F4'},
  NE:{label:'Not Evaluated',c:'#737373',bg:'#F4F4F4'},
};
function parseStatus(s){
  if(!s) return 'DD';
  const l=s.toLowerCase();
  if(l.includes('critically')) return 'CR';
  if(l.includes('endangered')) return 'EN';
  if(l.includes('vulnerable')) return 'VU';
  if(l.includes('near')) return 'NT';
  if(l.includes('least')) return 'LC';
  return 'DD';
}

// ─── SUPABASE ─────────────────────────────────────────────
async function fetchSpecies() {
  const r = await fetch(
    `${SB_URL}/rest/v1/${TABLE}?select=*&order=scientific_name`,
    {headers: SB_HDR}
  );
  if (!r.ok) throw new Error(`Supabase error ${r.status}: ${await r.text()}`);
  return r.json();
}

function mapRow(r){
  const iucn = parseStatus(r.conservation_status);
  return {
    id: r.id,
    sci: r.scientific_name || '',
    genus: r.genus || '',
    family: r.family || 'Dipterocarpaceae',
    common: [r.local_name_malay, r.maksud_epitet].filter(Boolean),
    iucn,
    conservation_status: r.conservation_status || '',
    endemic: !!r.endemic_to_malaysia,
    height: r.height_range || '—',
    dbh: r.trunk_diameter || '—',
    habitat: r.habitat || '—',
    altitude: r.elevation_range || '—',
    phenology: r.flowering_pattern || '—',
    bark: r.bark_description || '',
    leaf: r.leaf_description || '',
    flower: r.flower_description || '',
    fruit: r.fruit_description || '',
    ecological_notes: r.ecological_notes || '',
    uses: r.economic_importance || '—',
    dist: [
      r.distribution_peninsular && 'Peninsular Malaysia',
      r.distribution_sabah && 'Sabah',
      r.distribution_sarawak && 'Sarawak',
    ].filter(Boolean),
    image_url: r.image_url || '',
  };
}

// ─── ATOMS ────────────────────────────────────────────────
function Pill({code,size}){
  const m = IUCN_MAP[code] || IUCN_MAP.NE;
  const sm = size==='sm';
  return <span style={{display:'inline-flex',alignItems:'center',gap:4,
    padding:sm?'1px 6px':'2px 8px',fontSize:sm?11:12,fontWeight:500,
    background:m.bg,color:m.c,borderRadius:999,border:`1px solid ${m.c}22`}}>
    <span style={{width:5,height:5,borderRadius:999,background:m.c}}/>
    {code}
  </span>;
}

function Btn({children,variant='primary',size='md',icon,onClick,disabled,full}){
  const v={
    primary:{bg:'var(--text)',c:'var(--bg)',b:'var(--text)'},
    secondary:{bg:'var(--surface)',c:'var(--text)',b:'var(--border-strong)'},
    ghost:{bg:'transparent',c:'var(--text)',b:'transparent'},
    accent:{bg:'var(--accent)',c:'white',b:'var(--accent)'},
  }[variant];
  const p={sm:'6px 10px',md:'8px 14px',lg:'11px 18px'}[size];
  return <button disabled={disabled} onClick={onClick} style={{
    display:'inline-flex',alignItems:'center',justifyContent:'center',gap:6,padding:p,
    background:disabled?'var(--surface-2)':v.bg,color:disabled?'var(--text-3)':v.c,
    border:`1px solid ${disabled?'var(--border)':v.b}`,borderRadius:'var(--radius-sm)',
    fontSize:size==='sm'?13:14,fontWeight:500,cursor:disabled?'not-allowed':'pointer',
    transition:'opacity .12s',width:full?'100%':undefined,whiteSpace:'nowrap',
  }}>{icon}{children}</button>;
}

function SearchBox({value,onChange,placeholder}){
  return <div style={{display:'flex',alignItems:'center',gap:8,padding:'9px 12px',

      <path d="M11 11l3.5 3.5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/>
    </svg>
    <input value={value} onChange={onChange} placeholder={placeholder}
      style={{flex:1,background:'none',border:'none',outline:'none',fontSize:14,color:'var(--text)'}}/>
  </div>;
}

function PlaceholderImg({seed=0,ratio='4/3',rounded=true}){
  const hue = 80+(seed*13)%60;
  return <div style={{width:'100%',aspectRatio:ratio,
    background:`linear-gradient(135deg,hsl(${hue},18%,88%),hsl(${hue+20},22%,78%))`,
    borderRadius:rounded?'var(--radius)':0,border:'1px solid var(--border)',
    position:'relative',overflow:'hidden'}}>
    <div style={{position:'absolute',inset:0,
      backgroundImage:`radial-gradient(circle at 30% 70%,hsla(${hue+30},35%,55%,.4),transparent 55%),radial-gradient(circle at 75% 35%,hsla(${hue-10},25%,75%,.5),transparent 50%)`}}/>
  </div>;
}

function SpeciesImg({src,seed,ratio,rounded}){
  const [err,setErr]=useState(false);
  if(src && !err) return <img src={src} onError={()=>setErr(true)}
    style={{width:'100%',aspectRatio:ratio||'4/3',objectFit:'cover',
      borderRadius:rounded!==false?'var(--radius)':0,border:'1px solid var(--border)',display:'block'}}/>;
  return <PlaceholderImg seed={seed} ratio={ratio} rounded={rounded}/>;
}

// ─── CARD ─────────────────────────────────────────────────
function Card({s,i,onClick}){

    style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:12,
      padding:0,cursor:'pointer',textAlign:'left',overflow:'hidden',
      boxShadow:hov?'var(--shadow)':'none',transform:hov?'translateY(-2px)':'none',transition:'all .15s'}}>
    <div style={{padding:8,paddingBottom:0}}>
      <SpeciesImg src={s.image_url} seed={i} ratio="4/3"/>
    </div>
    <div style={{padding:16}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:8,marginBottom:8}}>
        <span style={{fontSize:11,color:'var(--text-3)',fontFamily:'monospace'}}>{s.family}</span>
        <div style={{display:'flex',gap:4}}>
          <Pill code={s.iucn} size="sm"/>
          {s.endemic&&<span style={{fontSize:11,padding:'1px 6px',background:'var(--text)',color:'var(--bg)',borderRadius:999}}>Endemik</span>}
        </div>
      </div>
      <div style={{fontSize:17,fontWeight:500,fontStyle:'italic',lineHeight:1.2,marginBottom:4}}>{s.sci}</div>
      <div style={{fontSize:13,color:'var(--text-2)'}}>{s.common[0]||s.genus}</div>
    </div>
  </button>;
}

  const [filters,setFilters]=useState({genus:[],iucn:[],region:[],endemic:false});
  const [sort,setSort]=useState('name');

  const allGenera=useMemo(()=>[...new Set(species.map(s=>s.genus).filter(Boolean))].sort(),[species]);

  const filtered=useMemo(()=>{
    let r=[...species];
    if(query){const q=query.toLowerCase();r=r.filter(s=>
      s.sci.toLowerCase().includes(q)||s.genus.toLowerCase().includes(q)||
      s.family.toLowerCase().includes(q)||s.common.some(c=>c.toLowerCase().includes(q)));}
    if(filters.genus.length) r=r.filter(s=>filters.genus.includes(s.genus));
    if(filters.iucn.length)  r=r.filter(s=>filters.iucn.includes(s.iucn));
    if(filters.region.length) r=r.filter(s=>filters.region.some(rg=>s.dist.includes(rg)));
    if(filters.endemic) r=r.filter(s=>s.endemic);
    if(sort==='name') r.sort((a,b)=>a.sci.localeCompare(b.sci));
    if(sort==='status'){const o=['CR','EN','VU','NT','LC','DD','NE'];r.sort((a,b)=>o.indexOf(a.iucn)-o.indexOf(b.iucn));}
    return r;
  },[species,query,filters,sort]);

  const tog=(k,v)=>setFilters(f=>({...f,[k]:f[k].includes(v)?f[k].filter(x=>x!==v):[...f[k],v]}));
  const active=filters.genus.length+filters.iucn.length+filters.region.length+(filters.endemic?1:0);

  return <div style={{maxWidth:1280,margin:'0 auto',padding:'32px'}}>
    <div style={{marginBottom:24}}>
      <h1 style={{fontSize:26,fontWeight:600,margin:0}}>{ui.browse}</h1>
      <p style={{fontSize:14,color:'var(--text-2)',margin:'6px 0 0'}}>
        {filtered.length} {ui.stats_sp}
        {query&&<> · "{query}"</>}
        {active>0&&<> · {active} {ui.filters.toLowerCase()}</>}
      </p>
    </div>
    <div style={{display:'grid',gridTemplateColumns:'220px 1fr',gap:32}}>
      {/* Sidebar */}
      <aside>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',
          marginBottom:12,paddingBottom:12,borderBottom:'1px solid var(--border)'}}>
          <span style={{fontSize:13,fontWeight:600}}>{ui.filters}</span>
          {active>0&&<button onClick={()=>setFilters({genus:[],iucn:[],region:[],endemic:false})}
            style={{background:'none',border:'none',color:'var(--accent)',fontSize:12,cursor:'pointer'}}>
            {ui.clear}</button>}
        </div>
        <FGroup title={ui.iucn} open>
          {['CR','EN','VU','NT','LC','DD'].map(c=>(
            <Chk key={c} checked={filters.iucn.includes(c)} onClick={()=>tog('iucn',c)}>
              <Pill code={c} size="sm"/>
              <span style={{marginLeft:'auto',fontSize:11,color:'var(--text-3)'}}>{species.filter(s=>s.iucn===c).length}</span>
            </Chk>
          ))}
        </FGroup>
        <FGroup title={ui.genus} open>
          {allGenera.map(g=>(
            <Chk key={g} checked={filters.genus.includes(g)} onClick={()=>tog('genus',g)}>
              <span style={{fontSize:13,fontStyle:'italic'}}>{g}</span>
              <span style={{marginLeft:'auto',fontSize:11,color:'var(--text-3)'}}>{species.filter(s=>s.genus===g).length}</span>
            </Chk>
          ))}
        </FGroup>
        <FGroup title={ui.region}>
          {['Peninsular Malaysia','Sabah','Sarawak'].map(rg=>(
            <Chk key={rg} checked={filters.region.includes(rg)} onClick={()=>tog('region',rg)}>
              <span style={{fontSize:13}}>{tval(rg,lang)}</span>
            </Chk>
          ))}
        </FGroup>
        <FGroup title={ui.others} open>
          <Chk checked={filters.endemic} onClick={()=>setFilters(f=>({...f,endemic:!f.endemic}))}>
            <span style={{fontSize:13}}>{ui.endemic_my}</span>
          </Chk>
        </FGroup>
      </aside>
      {/* Results */}
      <main>
        <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:16}}>
          <div style={{flex:1}}><SearchBox value={query} onChange={e=>setQuery(e.target.value)} placeholder={ui.search}/></div>
          <select value={sort} onChange={e=>setSort(e.target.value)} style={{
            background:'var(--surface)',border:'1px solid var(--border-strong)',
            borderRadius:'var(--radius-sm)',padding:'9px 12px',fontSize:13,cursor:'pointer'}}>
            <option value="name">{ui.sort_az}</option>
            <option value="status">{ui.sort_thr}</option>
          </select>
          <div style={{display:'flex',border:'1px solid var(--border-strong)',borderRadius:'var(--radius-sm)',overflow:'hidden'}}>
            {[['grid','⊞'],['list','≡']].map(([v,ic])=>(
              <button key={v} onClick={()=>setView(v)} style={{
                background:view===v?'var(--text)':'var(--surface)',
                color:view===v?'var(--bg)':'var(--text-2)',
                border:'none',padding:'9px 12px',cursor:'pointer',fontSize:14}}>
                {ic}
              </button>
            ))}
          </div>
        </div>
        {filtered.length===0
          ? <div style={{padding:64,textAlign:'center',background:'var(--surface)',
              border:'1px dashed var(--border-strong)',borderRadius:12}}>
              <div style={{fontSize:16,fontWeight:500,marginBottom:6}}>{ui.no_match}</div>
              <div style={{fontSize:13,color:'var(--text-2)',marginBottom:16}}>{ui.no_match_sub}</div>
              <Btn variant="secondary" onClick={()=>{setQuery('');setFilters({genus:[],iucn:[],region:[],endemic:false});}}>{ui.reset}</Btn>
            </div>
          : view==='grid'
            ? <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:16}}>
                {filtered.map((s,i)=><Card key={s.id} s={s} i={i} onClick={()=>{setDetailId(s.id);setRoute('detail');}}/>)}
              </div>
            : <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:12,overflow:'hidden'}}>
                {filtered.map((s,i)=>(
                  <button key={s.id} onClick={()=>{setDetailId(s.id);setRoute('detail');}}
                    style={{display:'grid',gridTemplateColumns:'48px 1.5fr 1fr 0.8fr 60px 70px',
                      padding:'11px 16px',width:'100%',background:'none',border:'none',
                      borderTop:i>0?'1px solid var(--border)':'none',
                      textAlign:'left',cursor:'pointer',alignItems:'center',color:'var(--text)'}}
                    onMouseEnter={e=>e.currentTarget.style.background='var(--surface-2)'}
                    onMouseLeave={e=>e.currentTarget.style.background='none'}>
                    <div style={{width:38,height:38,borderRadius:6,overflow:'hidden'}}>
                      <SpeciesImg src={s.image_url} seed={i} ratio="1/1" rounded={false}/>
                    </div>
                    <div>
                      <div style={{fontSize:14,fontStyle:'italic',fontWeight:500}}>{s.sci}</div>
                      <div style={{fontSize:11,color:'var(--text-3)',fontFamily:'monospace'}}>{s.family}</div>
                    </div>
                    <div style={{fontSize:13}}>{s.common[0]||'—'}</div>
                    <div style={{fontSize:13,fontStyle:'italic',color:'var(--text-2)'}}>{s.genus}</div>
                    <Pill code={s.iucn} size="sm"/>
                    <div style={{fontSize:12,color:'var(--text-3)'}}>{s.dist.map(d=>d.replace('Peninsular Malaysia','Pen.')).join(', ')||'—'}</div>
                  </button>
                ))}
              </div>
        }
      </main>
    </div>
  </div>;
}

function FGroup({title,children,open:defOpen}){
  const [open,setOpen]=useState(!!defOpen);
  return <div style={{borderBottom:'1px solid var(--border)',padding:'12px 0'}}>
    <button onClick={()=>setOpen(o=>!o)} style={{display:'flex',justifyContent:'space-between',
      alignItems:'center',width:'100%',background:'none',border:'none',padding:0,
      cursor:'pointer',color:'var(--text)'}}>
      <span style={{fontSize:13,fontWeight:500}}>{title}</span>
      <span style={{fontSize:10,color:'var(--text-3)'}}>{open?'▲':'▼'}</span>
    </button>
    {open&&<div style={{marginTop:10,display:'flex',flexDirection:'column',gap:4}}>{children}</div>}
  </div>;
}

function Chk({checked,onClick,children}){
  return <button onClick={onClick} style={{display:'flex',alignItems:'center',gap:8,
    width:'100%',padding:'5px 0',background:'none',border:'none',cursor:'pointer',
    color:'var(--text)',textAlign:'left'}}>
    <span style={{width:16,height:16,borderRadius:4,flexShrink:0,
      border:`1.5px solid ${checked?'var(--text)':'var(--border-strong)'}`,
      background:checked?'var(--text)':'transparent',color:'var(--bg)',
      display:'flex',alignItems:'center',justifyContent:'center',fontSize:10}}>
      {checked&&'✓'}
    </span>
    <span style={{flex:1,display:'inline-flex',alignItems:'center',gap:6}}>{children}</span>
  </button>;
}

// ─── DETAIL ───────────────────────────────────────────────

            borderRadius:999,color:'var(--text-2)',fontFamily:'monospace'}}>{s.family}</span>
          {s.endemic&&<span style={{fontSize:11,padding:'2px 8px',background:'var(--text)',color:'var(--bg)',borderRadius:999}}>Endemik</span>}

        <div style={{marginTop:20,padding:16,background:'var(--surface)',border:'1px solid var(--border)',borderRadius:12}}>

    </div>}
  </div>;
}

}
function KV({k,v}){

    <div style={{fontSize:13,color:'var(--text-2)'}}>{k}</div>
    <div style={{fontSize:14}}>{v}</div>

}
function QF({k,v,last}){
  return <div style={{display:'flex',justifyContent:'space-between',padding:'8px 0',
    borderBottom:last?'none':'1px solid var(--border)'}}>
    <span style={{fontSize:13,color:'var(--text-2)'}}>{k}</span>

}

// ─── CONTRIBUTE ───────────────────────────────────────────
function Contribute({species,lang}){
  const ui=UI[lang];
  const [done,setDone]=useState(false);
  const [file,setFile]=useState(null);
  const [prev,setPrev]=useState(null);
  const [form,setForm]=useState({species_id:'',species_name:'',photo_type:'habit',
    contributor_name:'',contributor_email:'',locality:'',state:'',notes:'',agree:false});
  const [loading,setLoading]=useState(false);
  const [err,setErr]=useState('');
  const upd=(k,v)=>setForm(f=>({...f,[k]:v}));

  const onFile=e=>{
    const f=e.target.files[0]; if(!f) return;
    if(f.size>10*1024*1024){setErr('File too large. Max 10MB.'); return;}
    setFile(f);
    const r=new FileReader(); r.onload=ev=>setPrev(ev.target.result); r.readAsDataURL(f);
  };

  const submit=async()=>{
    if(!file){setErr('Please select a photo.'); return;}
    if(!form.species_name){setErr('Please select a species.'); return;}
    if(!form.contributor_name){setErr('Please enter your name.'); return;}
    if(!form.agree){setErr('Please agree to the license.'); return;}
    setLoading(true); setErr('');
    try{
      const ext=file.name.split('.').pop();
      const fname=`submissions/${Date.now()}.${ext}`;
      const up=await fetch(`${SB_URL}/storage/v1/object/species-photos/${fname}`,
        {method:'POST',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':file.type},body:file});
      if(!up.ok) throw new Error('Upload failed: '+(await up.text()));
      const imgUrl=`${SB_URL}/storage/v1/object/public/species-photos/${fname}`;
      const sub=await fetch(`${SB_URL}/rest/v1/photo_submissions`,
        {method:'POST',headers:{...SB_HDR,'Prefer':'return=minimal'},
         body:JSON.stringify({...form,image_url:imgUrl,status:'pending',submitted_at:new Date().toISOString()})});
      if(!sub.ok) throw new Error('Save failed: '+(await sub.text()));
      setDone(true);
    }catch(e){setErr(e.message);}
    finally{setLoading(false);}
  };

  if(done) return <div style={{maxWidth:500,margin:'80px auto',textAlign:'center',padding:32}}>
    <div style={{fontSize:48,marginBottom:16}}>✅</div>
    <h2 style={{fontSize:24,fontWeight:600,marginBottom:8}}>{lang==='en'?'Thank you!':'Terima kasih!'}</h2>
    <p style={{color:'var(--text-2)',marginBottom:24}}>{lang==='en'?'Your photo has been submitted for review.':'Foto anda telah dihantar untuk semakan.'}</p>
    <Btn variant="primary" onClick={()=>setDone(false)}>{lang==='en'?'Submit another':'Hantar lagi'}</Btn>
  </div>;

  const iStyle={width:'100%',padding:'9px 12px',background:'var(--surface)',
    border:'1px solid var(--border-strong)',borderRadius:'var(--radius-sm)',fontSize:14,
    color:'var(--text)',outline:'none'};
  const STATES=['Perlis','Kedah','Pulau Pinang','Perak','Selangor','Negeri Sembilan',
    'Melaka','Johor','Pahang','Terengganu','Kelantan','Kuala Lumpur','Sabah','Sarawak'];

  return <div style={{maxWidth:720,margin:'0 auto',padding:'40px 32px 64px'}}>
    <h1 style={{fontSize:26,fontWeight:600,margin:'0 0 8px'}}>{ui.contribute_title}</h1>
    <p style={{fontSize:14,color:'var(--text-2)',margin:'0 0 32px'}}>{lang==='en'?'Photos are reviewed before publishing.':'Gambar disemak sebelum diterbitkan.'}</p>
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:24}}>
      <div>
        <label style={{display:'block',cursor:'pointer'}}>
          <input type="file" accept="image/*" onChange={onFile} style={{display:'none'}}/>
          {prev
            ? <img src={prev} style={{width:'100%',aspectRatio:'4/3',objectFit:'cover',borderRadius:'var(--radius)',border:'2px solid var(--accent)'}}/>
            : <div style={{aspectRatio:'4/3',border:'2px dashed var(--border-strong)',borderRadius:'var(--radius)',
                display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',
                gap:8,color:'var(--text-3)',background:'var(--surface)'}}>
                <span style={{fontSize:32}}>📷</span>
                <div style={{fontSize:14}}>{lang==='en'?'Click to select photo':'Klik untuk pilih foto'}</div>
              </div>}
        </label>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:14}}>
        <div>
          <div style={{fontSize:11,fontWeight:500,color:'var(--text-3)',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:6}}>{lang==='en'?'Species *':'Spesies *'}</div>
          <select style={iStyle} value={form.species_id} onChange={e=>{
            const sel=species.find(s=>s.id===e.target.value);
            upd('species_id',e.target.value); upd('species_name',sel?sel.sci:'');
          }}>
            <option value="">{lang==='en'?'-- Select species --':'-- Pilih spesies --'}</option>
            {species.map(s=><option key={s.id} value={s.id}>{s.sci}{s.common[0]?' — '+s.common[0]:''}</option>)}
          </select>
        </div>
        <div>
          <div style={{fontSize:11,fontWeight:500,color:'var(--text-3)',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:6}}>{lang==='en'?'Your name *':'Nama anda *'}</div>
          <input style={iStyle} value={form.contributor_name} onChange={e=>upd('contributor_name',e.target.value)}/>
        </div>
        <div>
          <div style={{fontSize:11,fontWeight:500,color:'var(--text-3)',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:6}}>Email</div>
          <input type="email" style={iStyle} value={form.contributor_email} onChange={e=>upd('contributor_email',e.target.value)}/>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
          <div>
            <div style={{fontSize:11,fontWeight:500,color:'var(--text-3)',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:6}}>{lang==='en'?'State':'Negeri'}</div>
            <select style={iStyle} value={form.state} onChange={e=>upd('state',e.target.value)}>
              <option value="">--</option>
              {STATES.map(s=><option key={s}>{s}</option>)}
            </select>
          </div>
          <div>
            <div style={{fontSize:11,fontWeight:500,color:'var(--text-3)',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:6}}>{lang==='en'?'Locality':'Lokaliti'}</div>
            <input style={iStyle} value={form.locality} onChange={e=>upd('locality',e.target.value)}/>
          </div>
        </div>
        <label style={{display:'flex',gap:10,padding:12,border:'1px solid var(--border)',borderRadius:'var(--radius)',cursor:'pointer'}}>
          <input type="checkbox" checked={form.agree} onChange={e=>upd('agree',e.target.checked)} style={{marginTop:2,accentColor:'var(--accent)'}}/>
          <span style={{fontSize:12,color:'var(--text-2)',lineHeight:1.5}}>
            {lang==='en'
              ?'I confirm I own this photo and agree to license it under CC-BY 4.0.'
              :'Saya mengesahkan saya pemilik gambar ini dan bersetuju dengan lesen CC-BY 4.0.'}
          </span>
        </label>
        {err&&<div style={{fontSize:13,color:'var(--danger)',padding:'8px 12px',background:'#FEE2E2',borderRadius:6}}>{err}</div>}
        <Btn variant="accent" full disabled={loading} onClick={submit}>
          {loading?(lang==='en'?'Submitting…':'Menghantar…'):(lang==='en'?'Submit for review':'Hantar untuk semakan')}
        </Btn>
      </div>
    </div>
  </div>;
}

// ─── ABOUT ────────────────────────────────────────────────
function About({lang}){
  const ui=UI[lang];
  return <div style={{maxWidth:720,margin:'0 auto',padding:'48px 32px'}}>
    <h1 style={{fontSize:32,fontWeight:600,letterSpacing:'-0.025em',margin:'0 0 16px'}}>{ui.about_title}</h1>
    <p style={{fontSize:16,color:'var(--text-2)',lineHeight:1.6,margin:'0 0 32px'}}>
      {lang==='en'
        ?'A public, open-data database of Dipterocarpaceae species in Malaysia. Taxonomic data, conservation status, distribution, and morphology — all in one searchable archive.'
        :'Pangkalan data awam spesies Dipterocarpaceae Malaysia. Data taksonomi, status pemuliharaan, taburan, dan morfologi — semuanya dalam satu arkib carian.'}
    </p>
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:24}}>
      <div style={{padding:20,background:'var(--surface)',border:'1px solid var(--border)',borderRadius:12}}>
        <h3 style={{fontSize:15,fontWeight:600,margin:'0 0 10px'}}>{lang==='en'?'Database contents':'Kandungan pangkalan data'}</h3>
        <ul style={{fontSize:14,color:'var(--text-2)',lineHeight:1.7,margin:0,paddingLeft:18}}>
          <li>{lang==='en'?'Scientific names, genera, families':'Nama saintifik, genus, famili'}</li>
          <li>{lang==='en'?'Malay local names':'Nama Melayu tempatan'}</li>
          <li>{lang==='en'?'IUCN conservation status':'Status pemuliharaan IUCN'}</li>
          <li>{lang==='en'?'State-level distribution':'Taburan mengikut negeri'}</li>
          <li>{lang==='en'?'Morphological descriptions':'Huraian morfologi'}</li>
        </ul>
      </div>
      <div style={{padding:20,background:'var(--surface)',border:'1px solid var(--border)',borderRadius:12}}>
        <h3 style={{fontSize:15,fontWeight:600,margin:'0 0 10px'}}>Dipterocarpaceae</h3>
        <p style={{fontSize:14,color:'var(--text-2)',lineHeight:1.7,margin:0}}>
          {lang==='en'
            ?'The dominant family of Southeast Asian rainforests. In Malaysia, this includes meranti, keruing, resak, balau, and more — the foundation of forest ecosystems and the timber industry.'
            :'Famili pokok yang mendominasi hutan hujan Asia Tenggara. Di Malaysia, ini termasuk meranti, keruing, resak, balau, dan banyak lagi.'}
        </p>
      </div>
    </div>
    <div style={{marginTop:24,padding:20,background:'var(--accent-2)',border:'1px solid var(--accent)',borderRadius:12}}>
      <div style={{fontSize:13,fontWeight:500,color:'var(--accent)',marginBottom:4}}>
        {lang==='en'?'Data source':'Sumber data'}
      </div>
      <div style={{fontSize:14,color:'var(--text-2)'}}>
        Supabase · Table: <code style={{fontFamily:'monospace',fontSize:12}}>{TABLE}</code>
      </div>
    </div>
  </div>;
}

// ─── APP ──────────────────────────────────────────────────
function App(){
  const [route,setRoute]=useState('home');
  const [detailId,setDetailId]=useState(null);
  const [query,setQuery]=useState('');
  const [species,setSpecies]=useState([]);
  const [loading,setLoading]=useState(true);
  const [error,setError]=useState('');
  const [lang,setLang]=useState('en');

  useEffect(()=>{
    fetchSpecies()
      .then(rows=>{ setSpecies(rows.map(mapRow)); setLoading(false); })
      .catch(e=>{ setError(e.message); setLoading(false); });
  },[]);

  useEffect(()=>{ window.scrollTo({top:0}); },[route,detailId]);

  const onSearch=()=>setRoute('browse');

  return <LangCtx.Provider value={lang}>
    <TopBar route={route} setRoute={setRoute} query={query} setQuery={setQuery} onSearch={onSearch} lang={lang} setLang={setLang}/>
    <main style={{minHeight:'calc(100vh - 64px)'}}>
      {route==='home'    && <Home species={species} loading={loading} error={error} setRoute={setRoute} setDetailId={setDetailId} setQuery={setQuery}/>}
      {route==='browse'  && <Browse species={species} query={query} setQuery={setQuery} setRoute={setRoute} setDetailId={setDetailId}/>}
      {route==='detail'  && <Detail species={species} detailId={detailId} setRoute={setRoute} setQuery={setQuery}/>}
      {route==='contribute' && <Contribute species={species} lang={lang}/>}
      {route==='about'   && <About lang={lang}/>}
    </main>
    <footer style={{borderTop:'1px solid var(--border)',padding:'28px 32px',marginTop:48}}>
      <div style={{maxWidth:1280,margin:'0 auto',display:'flex',justifyContent:'space-between',
        flexWrap:'wrap',gap:16,fontSize:13,color:'var(--text-2)'}}>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <div style={{width:22,height:22,borderRadius:6,background:'var(--accent)',display:'inline-flex',
            alignItems:'center',justifyContent:'center',color:'white',fontSize:12}}>🌿</div>
          <span style={{fontWeight:500,color:'var(--text)'}}>Dipterokarp Malaysia</span>
          <span>· Dipterocarpaceae Database</span>
        </div>
        <div style={{fontFamily:'monospace',fontSize:12}}>v2.0 · CC-BY 4.0 · 2025–2026</div>
      </div>
    </footer>
  </LangCtx.Provider>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
