function Photo({ caption, w, h, ratio, seed=0, rounded=true }) {
  const hue = 80 + (seed * 13) % 60;
  return (
    <div style={{
      width: w||"100%", height: h, aspectRatio: ratio||(h?undefined:"4/3"),
      background: `linear-gradient(135deg, hsl(${hue}, 18%, 88%), hsl(${hue+20}, 22%, 78%))`,
      position: "relative", overflow: "hidden",
      borderRadius: rounded ? "var(--radius)" : 0,
      border: "1px solid var(--border)",
    }}>
      <div style={{ position:"absolute", inset:0,
        backgroundImage:`radial-gradient(circle at 30% 70%, hsla(${hue+30},35%,55%,0.45), transparent 55%), radial-gradient(circle at 75% 35%, hsla(${hue-10},25%,75%,0.55), transparent 50%)`}}/>
      <div style={{ position:"absolute", left: 10, bottom: 8,
        fontFamily:"var(--mono)", fontSize: 10, color: "rgba(20,30,25,0.65)",
        background: "rgba(255,255,255,0.7)", padding: "2px 6px", borderRadius: 4,
        backdropFilter: "blur(4px)", letterSpacing: "0.02em",
      }}>{caption}</div>
    </div>
  );
}

function Pill({ status, size }) {
  const m = STATUS[status] || STATUS.NE;
  const sm = size === "sm";
  return (
    <span style={{
      display: "inline-flex", alignItems: "center", gap: 4,
      padding: sm ? "1px 6px" : "2px 8px",
      fontSize: sm ? 11 : 12, fontWeight: 500,
      background: m.bg, color: m.c,
      borderRadius: 999, lineHeight: 1.5,
      border: `1px solid ${m.c}22`,
    }}>
      <span style={{ width: 5, height: 5, borderRadius: 999, background: m.c }}/>
      {m.short}
    </span>
  );
}

function Btn({ children, variant="primary", size="md", icon, iconRight, onClick, disabled, full, type }) {
  const variants = {
    primary: { bg: "var(--text)", c: "var(--bg)", border: "var(--text)" },
    secondary: { bg: "var(--surface)", c: "var(--text)", border: "var(--border-strong)" },
    ghost: { bg: "transparent", c: "var(--text)", border: "transparent" },
    accent: { bg: "var(--accent)", c: "white", border: "var(--accent)" },
    danger: { bg: "transparent", c: "var(--danger)", border: "transparent" },
  };
  const v = variants[variant];
  const sizes = { sm: "6px 10px 6px 10px", md: "8px 14px", lg: "11px 18px" };
  return (
    <button type={type||"button"} disabled={disabled} onClick={onClick} style={{
      display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 6,
      padding: sizes[size],
      background: disabled ? "var(--surface-2)" : v.bg,
      color: disabled ? "var(--text-3)" : v.c,
      border: `1px solid ${disabled ? "var(--border)" : v.border}`,
      borderRadius: "var(--radius-sm)",
      fontSize: size === "sm" ? 13 : 14, fontWeight: 500,
      cursor: disabled ? "not-allowed" : "pointer",
      transition: "all 0.12s",
      width: full ? "100%" : undefined,
      whiteSpace: "nowrap",
    }}
    onMouseEnter={e => { if (!disabled && variant === "primary") e.currentTarget.style.opacity = "0.88"; }}
    onMouseLeave={e => { e.currentTarget.style.opacity = "1"; }}
    >
      {icon}{children}{iconRight}
    </button>
  );
}

function Input({ value, onChange, placeholder, type, icon, full=true }) {
  return (
    <div style={{
      display: "flex", alignItems: "center", gap: 8,
      padding: "9px 12px",
      background: "var(--surface)", border: "1px solid var(--border-strong)",
      borderRadius: "var(--radius-sm)",
      width: full ? "100%" : undefined,
    }}>
      {icon && <span style={{ color: "var(--text-3)", display: "flex" }}>{icon}</span>}
      <input type={type||"text"} value={value} onChange={onChange} placeholder={placeholder}
        style={{ flex: 1, background: "none", border: "none", outline: "none", fontSize: 14, color: "var(--text)" }}/>
    </div>
  );
}

  const { t } = useLang();
  const navItems = [

      background: "color-mix(in srgb, var(--bg) 92%, transparent)",
      backdropFilter: "blur(12px)",
      borderBottom: "1px solid var(--border)",

            <Icon.leaf s={16} />
          </div>
          <span style={{ fontWeight: 600, fontSize: 15, letterSpacing: "-0.01em" }}>Pokok PM</span>
        </button>

        <span style={{ width: 1, height: 20, background: "var(--border)" }} />

        <nav style={{ display: "flex", gap: 4 }}>
          {navItems.map(it => (
            <button key={it.id} onClick={() => setRoute(it.id)} style={{
              background: route === it.id ? "var(--surface-2)" : "transparent",
              color: route === it.id ? "var(--text)" : "var(--text-2)",
              border: "none", padding: "7px 12px", borderRadius: 6,
              fontSize: 13, fontWeight: 500, cursor: "pointer",
            }}>{it.label}</button>
          ))}
        </nav>

        <div style={{ flex: 1, maxWidth: 460, marginLeft: 16 }}>
          <form onSubmit={(e) => { e.preventDefault(); onSubmitSearch(); }}>
            <Input
              value={query}
              onChange={e => setQuery(e.target.value)}
              placeholder={t.search_placeholder}
              icon={<Icon.search s={15} />}
            />
          </form>
        </div>

        <div style={{ flex: 1 }} />

        <LangToggle lang={lang} setLang={setLang} />

        <Btn variant="accent" icon={<Icon.camera s={15} />} onClick={() => setRoute("upload")}>
          {t.contribute_photo}
        </Btn>
      </div>
    </header>
  );
}

        {[

          ["318","Endemic to peninsula"],
          ["472","Threatened (IUCN)"],

            <div style={{ fontSize: 32, fontWeight: 600, letterSpacing: "-0.02em", color: "var(--text)" }}>{n}</div>
            <div style={{ fontSize: 13, color: "var(--text-2)", marginTop: 4 }}>{l}</div>

      {/* Featured */}
      <section style={{ marginBottom: 80 }}>
        <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 24 }}>
          <h2 style={{ fontSize: 24, fontWeight: 600, margin: 0, letterSpacing: "-0.01em" }}>Iconic species</h2>
          <button onClick={() => setRoute("browse")} style={{ background: "none", border: "none", color: "var(--text-2)", fontSize: 13, cursor: "pointer", display: "inline-flex", alignItems: "center", gap: 4 }}>
            View all <Icon.arrow s={12} />
          </button>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 16 }}>
          {featured.map((s, i) => (

}

function Card({ s, i, onClick }) {
  const [hover, setHover] = useState(false);
  return (
    <button onClick={onClick}
      onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}
      style={{
        background: "var(--surface)", border: "1px solid var(--border)", borderRadius: 12,
        padding: 0, cursor: "pointer", textAlign: "left", overflow: "hidden",
        transition: "all 0.15s",
        boxShadow: hover ? "var(--shadow)" : "var(--shadow-sm)",
        transform: hover ? "translateY(-2px)" : "none",
      }}>
      <div style={{ padding: 8, paddingBottom: 0 }}>
        <Photo caption={s.common[0]} seed={i+5} ratio="4/3" />
      </div>
      <div style={{ padding: 16 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8, marginBottom: 8 }}>
          <span style={{ fontSize: 11, color: "var(--text-3)", fontFamily: "var(--mono)" }}>{s.family}</span>
          <div style={{ display: "flex", gap: 4 }}>
            <Pill status={s.iucn} size="sm" />
            {s.endemic && <span style={{ fontSize: 11, padding: "1px 6px", background: "var(--text)", color: "var(--bg)", borderRadius: 999 }}>Endemic</span>}
          </div>
        </div>
        <div style={{ fontSize: 17, fontWeight: 500, fontStyle: "italic", lineHeight: 1.2, marginBottom: 4 }}>{s.sci}</div>
        <div style={{ fontSize: 13, color: "var(--text-2)" }}>{s.common[0]}</div>
      </div>
    </button>
  );
}

// ============ BROWSE ============
function Browse({ query, setQuery, setRoute, setSpeciesId }) {
  const { t } = useLang();
  const [view, setView] = useState("grid");
  const [filters, setFilters] = useState({ family: [], iucn: [], mrl: [], state: [], endemic: false });
  const [sort, setSort] = useState("name");

  const filtered = useMemo(() => {
    let r = SPECIES;
    if (query) {
      const q = query.toLowerCase().trim();
      r = r.filter(s =>
        s.sci.toLowerCase().includes(q) ||
        s.genus.toLowerCase().includes(q) ||
        s.family.toLowerCase().includes(q) ||
        s.common.some(c => c.toLowerCase().includes(q))
      );
    }
    if (filters.family.length) r = r.filter(s => filters.family.includes(s.family));
    if (filters.iucn.length) r = r.filter(s => filters.iucn.includes(s.iucn));
    if (filters.mrl.length) r = r.filter(s => filters.mrl.includes(s.mrl));
    if (filters.state.length) r = r.filter(s => filters.state.some(st => s.distribution.includes(st) || s.distribution.includes("All states")));
    if (filters.endemic) r = r.filter(s => s.endemic);
    if (sort === "name") r = [...r].sort((a,b) => a.sci.localeCompare(b.sci));
    if (sort === "status") {
      const order = ["CR","EN","VU","NT","LC","DD","NE"];
      r = [...r].sort((a,b) => order.indexOf(a.iucn) - order.indexOf(b.iucn));
    }
    if (sort === "photos") r = [...r].sort((a,b) => b.photos - a.photos);
    return r;
  }, [query, filters, sort]);

  const allFamilies = [...new Set(SPECIES.map(s => s.family))].sort();
  const toggle = (k, v) => setFilters(f => ({ ...f, [k]: f[k].includes(v) ? f[k].filter(x => x !== v) : [...f[k], v] }));
  const activeCount = filters.family.length + filters.iucn.length + filters.mrl.length + filters.state.length + (filters.endemic?1:0);

  return (
    <div style={{ maxWidth: 1280, margin: "0 auto", padding: "32px" }}>
      {/* Page header */}
      <div style={{ marginBottom: 24 }}>
        <h1 style={{ fontSize: 28, fontWeight: 600, margin: 0, letterSpacing: "-0.02em" }}>Browse the catalogue</h1>
        <p style={{ fontSize: 14, color: "var(--text-2)", margin: "6px 0 0" }}>
          {filtered.length} {filtered.length === 1 ? "species" : "species"}
          {query && <> matching “<span style={{ color: "var(--text)" }}>{query}</span>”</>}
          {activeCount > 0 && <> · {activeCount} filter{activeCount>1?"s":""} applied</>}
        </p>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "240px 1fr", gap: 32 }}>
        {/* Filters */}
        <aside>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12, paddingBottom: 12, borderBottom: "1px solid var(--border)" }}>
            <span style={{ fontSize: 13, fontWeight: 600 }}>Filters</span>
            {activeCount > 0 && (
              <button onClick={() => setFilters({ family:[], iucn:[], mrl:[], state:[], endemic:false })}
                style={{ background: "none", border: "none", color: "var(--accent)", fontSize: 12, cursor: "pointer" }}>Clear all</button>
            )}
          </div>

          <FilterGroup title="IUCN Red List" defaultOpen>
            {["CR","EN","VU","NT","LC","DD"].map(c => (
              <Check key={c} checked={filters.iucn.includes(c)} onClick={() => toggle("iucn", c)}>
                <Pill status={c} size="sm" />
                <span style={{ marginLeft: "auto", fontSize: 12, color: "var(--text-3)" }}>{SPECIES.filter(s => s.iucn === c).length}</span>
              </Check>
            ))}
          </FilterGroup>

          <FilterGroup title="Malaysia Red List">
            {["CR","EN","VU","LC","DD"].map(c => (
              <Check key={c} checked={filters.mrl.includes(c)} onClick={() => toggle("mrl", c)}>
                <Pill status={c} size="sm" />
                <span style={{ marginLeft: "auto", fontSize: 12, color: "var(--text-3)" }}>{SPECIES.filter(s => s.mrl === c).length}</span>
              </Check>
            ))}
          </FilterGroup>

          <FilterGroup title="Family">
            {allFamilies.map(f => (
              <Check key={f} checked={filters.family.includes(f)} onClick={() => toggle("family", f)}>
                <span style={{ fontSize: 13, fontStyle: "italic" }}>{f}</span>
              </Check>
            ))}
          </FilterGroup>

          <FilterGroup title="State">
            {STATES.slice(0, 8).map(st => (
              <Check key={st} checked={filters.state.includes(st)} onClick={() => toggle("state", st)}>
                <span style={{ fontSize: 13 }}>{st}</span>
              </Check>
            ))}
          </FilterGroup>

          <FilterGroup title={t.other} defaultOpen>
            <Check checked={filters.endemic} onClick={() => setFilters(f => ({ ...f, endemic: !f.endemic }))}>
              <span style={{ fontSize: 13 }}>Endemic to peninsula</span>
            </Check>
          </FilterGroup>
        </aside>

        {/* Results */}
        <main>
          <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 16 }}>
            <Input value={query} onChange={e => setQuery(e.target.value)} placeholder="Search species, genus, family, local name…" icon={<Icon.search s={15} />} />
            <select value={sort} onChange={e => setSort(e.target.value)} style={{
              background: "var(--surface)", border: "1px solid var(--border-strong)",
              borderRadius: "var(--radius-sm)", padding: "9px 12px", fontSize: 13, color: "var(--text)", cursor: "pointer",
            }}>
              <option value="name">A → Z</option>
              <option value="status">Most threatened</option>
              <option value="photos">Most photographed</option>
            </select>
            <div style={{ display: "flex", border: "1px solid var(--border-strong)", borderRadius: "var(--radius-sm)", overflow: "hidden" }}>
              <button onClick={() => setView("grid")} style={{
                background: view==="grid"?"var(--text)":"var(--surface)",
                color: view==="grid"?"var(--bg)":"var(--text-2)",
                border: "none", padding: "9px 11px", cursor: "pointer", display: "flex", alignItems: "center",
              }}><Icon.grid /></button>
              <button onClick={() => setView("list")} style={{
                background: view==="list"?"var(--text)":"var(--surface)",
                color: view==="list"?"var(--bg)":"var(--text-2)",
                border: "none", padding: "9px 11px", cursor: "pointer", display: "flex", alignItems: "center",
                borderLeft: "1px solid var(--border-strong)",
              }}><Icon.list /></button>
            </div>
          </div>

          {/* active filter chips */}
          {activeCount > 0 && (
            <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 16 }}>
              {[...filters.family.map(v=>["family",v]), ...filters.iucn.map(v=>["iucn",v]), ...filters.mrl.map(v=>["mrl",v]), ...filters.state.map(v=>["state",v])].map(([k,v]) => (
                <button key={k+v} onClick={() => toggle(k, v)} style={{
                  display: "inline-flex", alignItems: "center", gap: 6,
                  padding: "3px 4px 3px 10px", background: "var(--surface)", border: "1px solid var(--border)",
                  borderRadius: 999, fontSize: 12, cursor: "pointer", color: "var(--text)",
                }}>
                  <span style={{ color: "var(--text-3)", fontSize: 11 }}>{k}:</span> {v}
                  <span style={{ width: 18, height: 18, borderRadius: 999, background: "var(--surface-2)", display: "inline-flex", alignItems: "center", justifyContent: "center" }}>
                    <Icon.close s={10} />
                  </span>
                </button>
              ))}
              {filters.endemic && (
                <button onClick={() => setFilters(f => ({ ...f, endemic: false }))} style={{
                  display: "inline-flex", alignItems: "center", gap: 6,
                  padding: "3px 4px 3px 10px", background: "var(--surface)", border: "1px solid var(--border)",
                  borderRadius: 999, fontSize: 12, cursor: "pointer",
                }}>
                  Endemic
                  <span style={{ width: 18, height: 18, borderRadius: 999, background: "var(--surface-2)", display: "inline-flex", alignItems: "center", justifyContent: "center" }}><Icon.close s={10} /></span>
                </button>
              )}
            </div>
          )}

          {filtered.length === 0 ? (
            <div style={{ padding: 64, textAlign: "center", background: "var(--surface)", border: "1px dashed var(--border-strong)", borderRadius: 12 }}>
              <div style={{ fontSize: 16, fontWeight: 500, marginBottom: 6 }}>No species match those filters</div>
              <div style={{ fontSize: 13, color: "var(--text-2)", marginBottom: 16 }}>Try a broader search or clear some filters.</div>
              <Btn variant="secondary" onClick={() => { setQuery(""); setFilters({ family:[], iucn:[], mrl:[], state:[], endemic:false }); }}>Reset all</Btn>
            </div>
          ) : view === "grid" ? (
            <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 16 }}>
              {filtered.map((s, i) => (
                <Card key={s.id} s={s} i={i} onClick={() => { setSpeciesId(s.id); setRoute("detail"); }} />
              ))}
            </div>
          ) : (
            <div style={{ background: "var(--surface)", border: "1px solid var(--border)", borderRadius: 12, overflow: "hidden" }}>
              <div style={{ display: "grid", gridTemplateColumns: "60px 1.4fr 1fr 0.9fr 70px 70px 70px", padding: "10px 16px", borderBottom: "1px solid var(--border)", background: "var(--surface-2)", fontSize: 11, fontWeight: 500, color: "var(--text-3)", textTransform: "uppercase", letterSpacing: "0.04em" }}>
                <div></div><div>Species</div><div>Common name</div><div>Family</div><div>IUCN</div><div>MYS</div><div style={{ textAlign: "right" }}>Photos</div>
              </div>
              {filtered.map((s, i) => (
                <button key={s.id} onClick={() => { setSpeciesId(s.id); setRoute("detail"); }}
                  style={{ display: "grid", gridTemplateColumns: "60px 1.4fr 1fr 0.9fr 70px 70px 70px", padding: "12px 16px", width: "100%", background: "none", border: "none", borderTop: i>0?"1px solid var(--border)":"none", textAlign: "left", cursor: "pointer", alignItems: "center", color: "var(--text)" }}
                  onMouseEnter={e => e.currentTarget.style.background = "var(--surface-2)"}
                  onMouseLeave={e => e.currentTarget.style.background = "none"}>
                  <div style={{ width: 44, height: 44, borderRadius: 6, overflow: "hidden" }}>
                    <Photo caption="" seed={i} ratio="1/1" rounded={false} />
                  </div>
                  <div>
                    <div style={{ fontSize: 14, fontStyle: "italic", fontWeight: 500 }}>{s.sci}</div>
                    <div style={{ fontSize: 11, color: "var(--text-3)", fontFamily: "var(--mono)" }}>{s.author}</div>
                  </div>
                  <div style={{ fontSize: 13 }}>{s.common[0]}</div>
                  <div style={{ fontSize: 13, fontStyle: "italic", color: "var(--text-2)" }}>{s.family}</div>
                  <div><Pill status={s.iucn} size="sm" /></div>
                  <div><Pill status={s.mrl} size="sm" /></div>
                  <div style={{ textAlign: "right", fontSize: 13, color: "var(--text-2)", fontVariantNumeric: "tabular-nums" }}>{s.photos}</div>
                </button>
              ))}
            </div>
          )}
        </main>
      </div>
    </div>
  );
}

function FilterGroup({ title, children, defaultOpen }) {
  const [open, setOpen] = useState(defaultOpen||false);
  return (
    <div style={{ borderBottom: "1px solid var(--border)", padding: "12px 0" }}>
      <button onClick={() => setOpen(o => !o)} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", width: "100%", background: "none", border: "none", padding: 0, cursor: "pointer", color: "var(--text)" }}>
        <span style={{ fontSize: 13, fontWeight: 500 }}>{title}</span>
        <Icon.chev up={open} />
      </button>
      {open && <div style={{ marginTop: 10, display: "flex", flexDirection: "column", gap: 4 }}>{children}</div>}
    </div>
  );
}

function Check({ checked, onClick, children }) {
  return (
    <button onClick={onClick} style={{
      display: "flex", alignItems: "center", gap: 8, width: "100%", padding: "5px 0",
      background: "none", border: "none", cursor: "pointer", color: "var(--text)", textAlign: "left",
    }}>
      <span style={{
        width: 16, height: 16, borderRadius: 4, flexShrink: 0,
        border: "1.5px solid " + (checked ? "var(--text)" : "var(--border-strong)"),
        background: checked ? "var(--text)" : "transparent",
        color: "var(--bg)", display: "flex", alignItems: "center", justifyContent: "center",
      }}>{checked && <Icon.check s={10} />}</span>
      <span style={{ flex: 1, display: "inline-flex", alignItems: "center", gap: 6 }}>{children}</span>
    </button>
  );
}

// ============ DETAIL ============
function Detail({ speciesId, setSpeciesId, setRoute, setQuery }) {
  const { t } = useLang();
  const s = SPECIES.find(x => x.id === speciesId) || SPECIES[0];
  const [tab, setTab] = useState("overview");
  const [activePhoto, setActivePhoto] = useState(0);

  return (
    <div style={{ maxWidth: 1100, margin: "0 auto", padding: "24px 32px 64px" }}>
      {/* Breadcrumb */}
      <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13, color: "var(--text-3)", marginBottom: 24 }}>
        <button onClick={() => setRoute("home")} style={{ background: "none", border: "none", color: "var(--text-3)", cursor: "pointer", padding: 0, fontSize: 13 }}>Home</button>
        <span>/</span>
        <button onClick={() => setRoute("browse")} style={{ background: "none", border: "none", color: "var(--text-3)", cursor: "pointer", padding: 0, fontSize: 13 }}>Browse</button>
        <span>/</span>
        <button onClick={() => { setQuery(s.family); setRoute("browse"); }} style={{ background: "none", border: "none", color: "var(--text-3)", cursor: "pointer", padding: 0, fontSize: 13, fontStyle: "italic" }}>{s.family}</button>
        <span>/</span>
        <span style={{ color: "var(--text)", fontStyle: "italic" }}>{s.sci}</span>
      </div>

      {/* Hero */}
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 32, marginBottom: 40 }}>
        {/* Photos */}
        <div>
          <Photo caption={`${s.common[0]} — ${["habit","leaf","bark","fruit"][activePhoto]}`} seed={SPECIES.indexOf(s)*7 + activePhoto*3} ratio="4/3" />
          <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 8, marginTop: 8 }}>
            {[0,1,2,3].map(i => (
              <button key={i} onClick={() => setActivePhoto(i)} style={{
                aspectRatio: "1/1", padding: 0, cursor: "pointer", overflow: "hidden",
                borderRadius: "var(--radius)",
                border: "2px solid " + (activePhoto===i?"var(--text)":"transparent"),
                background: "none",
              }}>
                <Photo caption={["habit","leaf","bark","fruit"][i]} seed={SPECIES.indexOf(s)*7 + i*3} ratio="1/1" rounded={false} />
              </button>
            ))}
          </div>
          <div style={{ marginTop: 12, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <span style={{ fontSize: 12, color: "var(--text-3)" }}>{s.photos} photographs · {s.contributors} contributors</span>
            <Btn variant="ghost" size="sm" icon={<Icon.plus s={12} />} onClick={() => setRoute("upload")}>Add photo</Btn>
          </div>
        </div>

        {/* Title block */}
        <div>
          <div style={{ display: "flex", gap: 6, marginBottom: 12, flexWrap: "wrap" }}>
            <span style={{ fontSize: 11, padding: "2px 8px", background: "var(--surface)", border: "1px solid var(--border)", borderRadius: 999, color: "var(--text-2)", fontFamily: "var(--mono)" }}>{s.family}</span>
            {s.endemic && <span style={{ fontSize: 11, padding: "2px 8px", background: "var(--text)", color: "var(--bg)", borderRadius: 999, fontWeight: 500 }}>Endemic to peninsula</span>}
          </div>
          <h1 style={{ fontSize: 40, fontWeight: 500, fontStyle: "italic", letterSpacing: "-0.025em", margin: 0, lineHeight: 1.05 }}>
            {s.sci}
          </h1>
          <div style={{ fontSize: 14, color: "var(--text-3)", fontFamily: "var(--mono)", marginTop: 6 }}>{s.author}</div>

          <div style={{ marginTop: 20 }}>
            <div style={{ fontSize: 12, color: "var(--text-3)", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 6 }}>Common names</div>
            <div style={{ fontSize: 16, color: "var(--text)" }}>
              {s.common.map((c, i) => (<span key={c}>{c}{i<s.common.length-1 && <span style={{color:"var(--text-3)"}}> · </span>}</span>))}
            </div>
          </div>

          <div style={{ marginTop: 24, padding: 16, background: "var(--surface)", border: "1px solid var(--border)", borderRadius: 12 }}>
            <div style={{ fontSize: 12, color: "var(--text-3)", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 12 }}>Conservation status</div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
              <div>
                <div style={{ fontSize: 12, color: "var(--text-2)", marginBottom: 4 }}>IUCN Red List</div>
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <Pill status={s.iucn} />
                  <span style={{ fontSize: 13, color: "var(--text-2)" }}>{STATUS[s.iucn].label}</span>
                </div>
              </div>
              <div>
                <div style={{ fontSize: 12, color: "var(--text-2)", marginBottom: 4 }}>Malaysia Red List</div>
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <Pill status={s.mrl} />
                  <span style={{ fontSize: 13, color: "var(--text-2)" }}>{STATUS[s.mrl].label}</span>
                </div>
              </div>
            </div>
          </div>

          <div style={{ marginTop: 24, display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 12 }}>
            {[["Habit", s.habit],["Height", s.height],["DBH", s.dbh]].map(([k,v]) => (
              <div key={k}>
                <div style={{ fontSize: 11, color: "var(--text-3)", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 4 }}>{k}</div>
                <div style={{ fontSize: 14, color: "var(--text)" }}>{v}</div>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* Tabs */}
      <div style={{ borderBottom: "1px solid var(--border)", display: "flex", gap: 24, marginBottom: 32 }}>
        {[["overview",{t.overview}],["taxonomy",{t.taxonomy}],["distribution",{t.distribution_label}],["conservation","Conservation"]].map(([id,l]) => (
          <button key={id} onClick={() => setTab(id)} style={{
            background: "none", border: "none", padding: "10px 0",
            fontSize: 14, fontWeight: 500,
            color: tab===id?"var(--text)":"var(--text-2)",
            borderBottom: "2px solid " + (tab===id?"var(--text)":"transparent"),
            marginBottom: -1, cursor: "pointer",
          }}>{l}</button>
        ))}
      </div>

      {tab === "overview" && (
        <div style={{ display: "grid", gridTemplateColumns: "1fr 280px", gap: 48 }}>
          <div>
            <Section title={t.description_title}>
              <p style={{ fontSize: 15, lineHeight: 1.7, color: "var(--text)", margin: 0, textWrap: "pretty" }}>{t.t(s.description)}</p>
            </Section>
            <Section title="Habitat & ecology">
              <DataPair k={t.habitat} v={s.habitat} />
              <DataPair k={t.altitude} v={s.altitude} />
              <DataPair k={t.phenology} v={s.phenology} />
            </Section>
            <Section title="Uses & ethnobotany">
              <p style={{ fontSize: 15, lineHeight: 1.7, color: "var(--text)", margin: 0 }}>{t.t(s.uses)}</p>
            </Section>
          </div>
          <aside>
            <div style={{ padding: 16, background: "var(--surface)", border: "1px solid var(--border)", borderRadius: 12 }}>
              <div style={{ fontSize: 12, color: "var(--text-3)", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 12 }}>Quick facts</div>
              <Mini k={t.genus_label2} v={<span style={{fontStyle:"italic"}}>{s.genus}</span>} />
              <Mini k={t.family_label} v={<span style={{fontStyle:"italic"}}>{s.family}</span>} />
              <Mini k="Native to" v={s.distribution.length === 1 && s.distribution[0]==="All states" ? "All Peninsular states" : `${s.distribution.length} states`} />
              <Mini k="Photos" v={`${s.photos}`} />
              <Mini k="Updated" v={s.lastUpdated} last />
            </div>
            <div style={{ marginTop: 16 }}>
              <div style={{ fontSize: 12, color: "var(--text-3)", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 8 }}>Similar species</div>
              {s.similar.map(sim => {
                const found = SPECIES.find(x => x.sci === sim);
                return (
                  <button key={sim} onClick={() => found && setSpeciesId(found.id)} style={{
                    display: "block", padding: "8px 0", background: "none", border: "none", borderTop: "1px solid var(--border)",
                    width: "100%", textAlign: "left", cursor: found?"pointer":"default",
                    fontSize: 14, fontStyle: "italic", color: found?"var(--text)":"var(--text-3)",
                  }}>{sim}</button>
                );
              })}
            </div>
          </aside>
        </div>
      )}

      {tab === "taxonomy" && (
        <div style={{ background: "var(--surface)", border: "1px solid var(--border)", borderRadius: 12, padding: 24, maxWidth: 720 }}>
          <h3 style={{ fontSize: 16, fontWeight: 600, margin: "0 0 16px" }}>Taxonomic classification</h3>
          {[
            ["Kingdom", "Plantae"], ["Clade", "Tracheophytes / Angiosperms"],
            ["Order", s.family === "Dipterocarpaceae" ? "Malvales" : s.family === "Fabaceae" ? "Fabales" : s.family === "Lauraceae" ? "Laurales" : s.family === "Myrtaceae" ? "Myrtales" : "Rosales"],
            ["Family", s.family], ["Genus", s.genus], ["Species", s.sci.split(" ")[1]],
            ["Authority", s.author], ["Accepted name", s.sci],
          ].map(([k,v], i, arr) => (
            <div key={k} style={{ display: "grid", gridTemplateColumns: "180px 1fr", padding: "10px 0", borderTop: i>0?"1px solid var(--border)":"none" }}>
              <div style={{ fontSize: 13, color: "var(--text-2)" }}>{k}</div>
              <div style={{ fontSize: 14, fontStyle: k==="Family"||k==="Genus"||k==="Species"||k==="Accepted name"?"italic":"normal" }}>{v}</div>
            </div>
          ))}
        </div>
      )}

      {tab === "distribution" && (
        <div>
          <h3 style={{ fontSize: 16, fontWeight: 600, margin: "0 0 16px" }}>Recorded in {s.distribution.length === 1 && s.distribution[0]==="All states" ? "all peninsular states" : `${s.distribution.length} states`}</h3>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
            {STATES.map(st => {
              const present = s.distribution.includes(st) || s.distribution.includes("All states");
              return (
                <span key={st} style={{
                  display: "inline-flex", alignItems: "center", gap: 6,
                  padding: "6px 12px", borderRadius: 999,
                  fontSize: 13,
                  background: present ? "var(--accent-2)" : "var(--surface)",
                  color: present ? "var(--accent)" : "var(--text-3)",
                  border: "1px solid " + (present ? "var(--accent)" : "var(--border)"),
                }}>
                  <Icon.pin s={11} />
                  {st}
                </span>
              );
            })}
          </div>
          <div style={{ marginTop: 24, padding: 16, background: "var(--surface)", border: "1px solid var(--border)", borderRadius: 12 }}>
            <div style={{ fontSize: 13, fontWeight: 500, marginBottom: 6 }}>Habitat</div>
            <div style={{ fontSize: 14, color: "var(--text-2)" }}>{s.habitat}. Altitude {s.altitude}.</div>
          </div>
        </div>
      )}

      {tab === "conservation" && (
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
          <div style={{ padding: 24, background: "var(--surface)", border: "1px solid var(--border)", borderRadius: 12 }}>
            <div style={{ fontSize: 12, color: "var(--text-3)", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 12 }}>IUCN Red List</div>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <Pill status={s.iucn} />
              <div style={{ fontSize: 18, fontWeight: 500 }}>{STATUS[s.iucn].label}</div>
            </div>
            <div style={{ fontSize: 13, color: "var(--text-2)", marginTop: 8 }}>Last assessed: 2022</div>
          </div>
          <div style={{ padding: 24, background: "var(--surface)", border: "1px solid var(--border)", borderRadius: 12 }}>
            <div style={{ fontSize: 12, color: "var(--text-3)", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 12 }}>Malaysia Red List</div>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <Pill status={s.mrl} />
              <div style={{ fontSize: 18, fontWeight: 500 }}>{STATUS[s.mrl].label}</div>
            </div>
            <div style={{ fontSize: 13, color: "var(--text-2)", marginTop: 8 }}>Last assessed: 2024</div>
          </div>
          <div style={{ gridColumn: "1/-1", padding: 24, background: "var(--surface)", border: "1px solid var(--border)", borderRadius: 12 }}>
            <div style={{ fontSize: 12, color: "var(--text-3)", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 12 }}>Threats</div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
              {s.threats.map(t => (
                <span key={t} style={{ fontSize: 13, padding: "4px 10px", background: "#FEF2F2", color: "var(--danger)", border: "1px solid #FECACA", borderRadius: 999 }}>{t}</span>
              ))}
            </div>
          </div>
        </div>
      )}

      {/* CTA */}
      <div style={{ marginTop: 56, padding: 28, background: "var(--surface)", border: "1px solid var(--border)", borderRadius: 12, display: "flex", justifyContent: "space-between", alignItems: "center", gap: 16 }}>
        <div>
          <div style={{ fontSize: 18, fontWeight: 600, marginBottom: 4 }}>Have a photograph of <span style={{ fontStyle: "italic" }}>{s.sci}</span>?</div>
          <div style={{ fontSize: 14, color: "var(--text-2)" }}>Contribute to the catalogue. Reviewed by botanists at FRIM, credit always given.</div>
        </div>
        <Btn variant="primary" icon={<Icon.upload s={15} />} onClick={() => setRoute("upload")}>Submit photo</Btn>
      </div>
    </div>
  );
}

function Section({ title, children }) {
  return (
    <div style={{ marginBottom: 32 }}>
      <h3 style={{ fontSize: 13, fontWeight: 600, margin: "0 0 12px", color: "var(--text-3)", textTransform: "uppercase", letterSpacing: "0.08em" }}>{title}</h3>
      {children}
    </div>
  );
}
function DataPair({ k, v }) {
  return (
    <div style={{ display: "grid", gridTemplateColumns: "120px 1fr", padding: "8px 0", borderTop: "1px solid var(--border)" }}>
      <div style={{ fontSize: 13, color: "var(--text-2)" }}>{k}</div>
      <div style={{ fontSize: 14 }}>{v}</div>
    </div>
  );
}
function Mini({ k, v, last }) {
  return (
    <div style={{ display: "flex", justifyContent: "space-between", padding: "8px 0", borderBottom: last?"none":"1px solid var(--border)" }}>
      <span style={{ fontSize: 13, color: "var(--text-2)" }}>{k}</span>
      <span style={{ fontSize: 13 }}>{v}</span>
    </div>
  );
}

// ============ UPLOAD ============
function Upload({ setRoute }) {
  const [step, setStep] = useState(1);
  const [data, setData] = useState({ photo:false, photoCaption:"habit", species:"", state:"Pahang", locality:"", date:"2026-04-12", contributor:"", email:"", notes:"", license:"CC-BY 4.0", agree:false });
  const upd = (k,v) => setData(d => ({...d, [k]:v}));

  if (step === 5) return (
    <div style={{ maxWidth: 560, margin: "80px auto", textAlign: "center", padding: 32 }}>
      <div style={{ width: 56, height: 56, borderRadius: 999, background: "var(--accent-2)", color: "var(--accent)", margin: "0 auto 20px", display: "flex", alignItems: "center", justifyContent: "center" }}>
        <Icon.check s={22} />
      </div>
      <h1 style={{ fontSize: 28, fontWeight: 600, margin: "0 0 12px", letterSpacing: "-0.02em" }}>Submission received</h1>
      <p style={{ fontSize: 15, color: "var(--text-2)", margin: "0 0 24px", lineHeight: 1.6 }}>
        Reference <span style={{ fontFamily: "var(--mono)", color: "var(--text)" }}>SUB-2026-04-1147</span>. We'll email you when a botanist has reviewed it — typically within 3–5 days.
      </p>
      <div style={{ display: "flex", gap: 8, justifyContent: "center" }}>
        <Btn variant="primary" onClick={() => setRoute("home")}>Back to home</Btn>
        <Btn variant="secondary" onClick={() => { setStep(1); setData({ photo:false, photoCaption:"habit", species:"", state:"Pahang", locality:"", date:"2026-04-12", contributor:"", email:"", notes:"", license:"CC-BY 4.0", agree:false }); }}>Submit another</Btn>
      </div>
    </div>
  );

  const steps = [
    { n: 1, t: "Photo" }, { n: 2, t: "Identify" }, { n: 3, t: "Location" }, { n: 4, t: "Credit" },
  ];

  return (
    <div style={{ maxWidth: 760, margin: "0 auto", padding: "32px" }}>
      <h1 style={{ fontSize: 28, fontWeight: 600, margin: 0, letterSpacing: "-0.02em" }}>Contribute a photograph</h1>
      <p style={{ fontSize: 14, color: "var(--text-2)", margin: "6px 0 32px", maxWidth: 540 }}>
        Anyone may contribute. Submissions enter a moderation queue and are reviewed within 3–5 days.
      </p>

      {/* Stepper */}
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 32 }}>
        {steps.map((sx, i) => (
          <React.Fragment key={sx.n}>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <span style={{
                width: 24, height: 24, borderRadius: 999,
                background: step >= sx.n ? "var(--text)" : "var(--surface)",
                color: step >= sx.n ? "var(--bg)" : "var(--text-3)",
                border: "1px solid " + (step >= sx.n ? "var(--text)" : "var(--border-strong)"),
                display: "inline-flex", alignItems: "center", justifyContent: "center",
                fontSize: 12, fontWeight: 600,
              }}>{step > sx.n ? <Icon.check s={11} /> : sx.n}</span>
              <span style={{ fontSize: 13, fontWeight: 500, color: step === sx.n ? "var(--text)" : "var(--text-2)" }}>{sx.t}</span>
            </div>
            {i < steps.length-1 && <div style={{ flex: 1, height: 1, background: "var(--border)" }} />}
          </React.Fragment>
        ))}
      </div>

      <div style={{ background: "var(--surface)", border: "1px solid var(--border)", borderRadius: 12, padding: 32 }}>
        {step === 1 && (
          <div>
            <h2 style={{ fontSize: 17, fontWeight: 600, margin: "0 0 4px" }}>Upload your photograph</h2>
            <p style={{ fontSize: 13, color: "var(--text-2)", margin: "0 0 20px" }}>JPG, PNG, or HEIC up to 24 MB. EXIF data will be read automatically.</p>
            <button onClick={() => upd("photo", true)} style={{
              width: "100%", aspectRatio: "16/9", padding: 0, cursor: "pointer",
              background: data.photo ? "transparent" : "var(--surface-2)",
              border: "2px dashed " + (data.photo ? "transparent" : "var(--border-strong)"),
              borderRadius: 12, overflow: "hidden", color: "var(--text-2)",
              display: "flex", alignItems: "center", justifyContent: "center",
            }}>
              {data.photo ? (
                <Photo caption="merbau-canopy.jpg · 4032×3024" seed={42} ratio="16/9" rounded={false} />
              ) : (
                <div style={{ textAlign: "center" }}>
                  <Icon.upload s={28} />
                  <div style={{ fontSize: 15, fontWeight: 500, color: "var(--text)", marginTop: 12 }}>Drop a photograph here, or click to browse</div>
                  <div style={{ fontSize: 12, color: "var(--text-3)", marginTop: 4 }}>JPG · PNG · HEIC up to 24 MB</div>
                </div>
              )}
            </button>
            <div style={{ marginTop: 24 }}>
              <Label>What part of the tree?</Label>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 8, marginTop: 8 }}>
                {["habit","leaf","bark","flower","fruit","seedling","seed","other"].map(p => (
                  <Pillbtn key={p} active={data.photoCaption===p} onClick={() => upd("photoCaption", p)}>{p}</Pillbtn>
                ))}
              </div>
            </div>
          </div>
        )}

        {step === 2 && (
          <div>
            <h2 style={{ fontSize: 17, fontWeight: 600, margin: "0 0 4px" }}>Identify the species</h2>
            <p style={{ fontSize: 13, color: "var(--text-2)", margin: "0 0 20px" }}>Type a partial scientific or local name. Don't know? Leave blank — we'll identify it.</p>
            <Input value={data.species} onChange={e => upd("species", e.target.value)} placeholder="e.g. Shorea curtisii, Tualang, Meranti…" icon={<Icon.search s={15} />} />
            <div style={{ marginTop: 16 }}>
              <Label>Suggestions</Label>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginTop: 8 }}>
                {SPECIES.filter(s => !data.species || s.sci.toLowerCase().includes(data.species.toLowerCase()) || s.common.some(c => c.toLowerCase().includes(data.species.toLowerCase()))).slice(0,4).map(s => (
                  <button key={s.id} onClick={() => upd("species", s.sci)} style={{
                    display: "flex", alignItems: "center", gap: 10, padding: 10,
                    background: data.species===s.sci?"var(--accent-2)":"var(--surface)",
                    border: "1px solid " + (data.species===s.sci?"var(--accent)":"var(--border)"),
                    borderRadius: 8, textAlign: "left", cursor: "pointer", color: "var(--text)",
                  }}>
                    <div style={{ width: 36, height: 36, borderRadius: 6, overflow: "hidden", flexShrink: 0 }}>
                      <Photo caption="" seed={SPECIES.indexOf(s)} ratio="1/1" rounded={false} />
                    </div>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontSize: 13, fontStyle: "italic", fontWeight: 500, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{s.sci}</div>
                      <div style={{ fontSize: 12, color: "var(--text-2)" }}>{s.common[0]}</div>
                    </div>
                    <Pill status={s.iucn} size="sm" />
                  </button>
                ))}
              </div>
            </div>
          </div>
        )}

        {step === 3 && (
          <div>
            <h2 style={{ fontSize: 17, fontWeight: 600, margin: "0 0 4px" }}>Location and date</h2>
            <p style={{ fontSize: 13, color: "var(--text-2)", margin: "0 0 20px" }}>Where and when was this photograph taken?</p>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
              <Field label="State">
                <select value={data.state} onChange={e => upd("state", e.target.value)} style={selectStyle}>
                  {STATES.map(st => <option key={st}>{st}</option>)}
                </select>
              </Field>
              <Field label="Date observed">
                <input type="date" value={data.date} onChange={e => upd("date", e.target.value)} style={inputStyle} />
              </Field>
              <Field label="Locality / Forest reserve" wide>
                <input type="text" value={data.locality} onChange={e => upd("locality", e.target.value)} placeholder="e.g. Krau Wildlife Reserve, near Kuala Lompat" style={inputStyle} />
              </Field>
              <Field label="Field notes (optional)" wide>
                <textarea value={data.notes} onChange={e => upd("notes", e.target.value)} rows="3" placeholder="Co-occurring species, soil type, animal interactions…" style={{...inputStyle, resize: "vertical", minHeight: 80}} />
              </Field>
            </div>
            <div style={{ marginTop: 16, padding: 12, display: "flex", gap: 10, alignItems: "center", background: "var(--accent-2)", borderRadius: 8, color: "var(--accent)", fontSize: 13 }}>
              <Icon.pin s={14} />
              <span>GPS detected from EXIF: <strong>3.7211°N, 102.1893°E</strong> — within Krau Wildlife Reserve. Precise coordinates are masked for threatened species.</span>
            </div>
          </div>
        )}

        {step === 4 && (
          <div>
            <h2 style={{ fontSize: 17, fontWeight: 600, margin: "0 0 4px" }}>Credit and license</h2>
            <p style={{ fontSize: 13, color: "var(--text-2)", margin: "0 0 20px" }}>How should we credit you, and how can others use this photograph?</p>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
              <Field label="Your name">
                <input type="text" value={data.contributor} onChange={e => upd("contributor", e.target.value)} placeholder="How you'd like to be credited" style={inputStyle} />
              </Field>
              <Field label="Email (private)">
                <input type="email" value={data.email} onChange={e => upd("email", e.target.value)} placeholder="So we can notify you" style={inputStyle} />
              </Field>
              <Field label="License" wide>
                <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 8 }}>
                  {[["CC-BY 4.0","Free use with attribution"],["CC-BY-NC 4.0","Non-commercial only"],["CC0","Public domain"]].map(([l,d]) => (
                    <button key={l} onClick={() => upd("license", l)} style={{
                      padding: 14, textAlign: "left", cursor: "pointer", borderRadius: 8,
                      background: data.license===l?"var(--accent-2)":"var(--surface)",
                      border: "1px solid " + (data.license===l?"var(--accent)":"var(--border-strong)"),
                      color: "var(--text)",
                    }}>
                      <div style={{ fontFamily: "var(--mono)", fontSize: 12, fontWeight: 500 }}>{l}</div>
                      <div style={{ fontSize: 12, color: "var(--text-2)", marginTop: 4 }}>{d}</div>
                    </button>
                  ))}
                </div>
              </Field>
            </div>
            <label style={{ display: "flex", gap: 10, marginTop: 20, padding: 14, border: "1px solid var(--border)", borderRadius: 8, cursor: "pointer", alignItems: "flex-start" }}>
              <input type="checkbox" checked={data.agree} onChange={e => upd("agree", e.target.checked)} style={{ marginTop: 3, accentColor: "var(--accent)" }} />
              <span style={{ fontSize: 13, color: "var(--text-2)", lineHeight: 1.5 }}>
                I confirm I am the author of this photograph (or authorised to upload it), no copyright is infringed, and I agree to license it under the terms above. Submissions are subject to FRIM moderation.
              </span>
            </label>
          </div>
        )}
      </div>

      {/* Nav */}
      <div style={{ display: "flex", justifyContent: "space-between", marginTop: 24 }}>
        <Btn variant="secondary" icon={<Icon.arrow dir="left" s={12} />} onClick={() => step>1 ? setStep(s=>s-1) : setRoute("home")}>
          {step > 1 ? "Previous" : "Cancel"}
        </Btn>
        <Btn variant="primary" iconRight={<Icon.arrow s={12} />} disabled={step===4 && !data.agree} onClick={() => setStep(s => s+1)}>
          {step === 4 ? "Submit for review" : "Continue"}
        </Btn>
      </div>
    </div>
  );
}

function Label({ children }) {
  return <div style={{ fontSize: 12, fontWeight: 500, color: "var(--text-2)", textTransform: "uppercase", letterSpacing: "0.06em" }}>{children}</div>;
}
function Field({ label, children, wide }) {
  return (
    <div style={{ gridColumn: wide?"1/-1":"auto" }}>
      <Label>{label}</Label>
      <div style={{ marginTop: 6 }}>{children}</div>
    </div>
  );
}
function Pillbtn({ active, onClick, children }) {
  return (
    <button onClick={onClick} style={{
      padding: "8px 12px", borderRadius: 8, cursor: "pointer",
      background: active?"var(--text)":"var(--surface)",
      color: active?"var(--bg)":"var(--text)",
