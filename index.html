  :root {

<script type="text/babel">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

// ============================================================
// CONFIGURATION — replace with your values
// ============================================================
const SUPABASE_URL  = 'https://xrntnarchlglhllvlrnv.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhybnRuYXJjaGxnbGhsbHZscm52Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU0MTU4MzksImV4cCI6MjA4MDk5MTgzOX0.Q0PjW5dMU07EDoR-GGDpIjATlSC5AJxNeEdOlYaO96w';
const TABLE        = 'dipterocarp_species_2025_12_11_02_08';
const ADMIN_USER   = 'admin';
const ADMIN_PASS   = 'dipterocarp2025';

// ============================================================
// SUPABASE API
// ============================================================
const headers = () => ({ 'apikey': SUPABASE_ANON, 'Authorization': `Bearer ${SUPABASE_ANON}`, 'Content-Type': 'application/json' });

async function dbGet()            { const r = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?select=*&order=scientific_name`, { headers: headers() }); if (!r.ok) throw new Error(await r.text()); return r.json(); }
async function dbInsert(data)     { const r = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}`, { method: 'POST', headers: { ...headers(), 'Prefer': 'return=representation' }, body: JSON.stringify(data) }); if (!r.ok) throw new Error(await r.text()); return r.json(); }
async function dbUpdate(id, data) { const r = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?id=eq.${id}`, { method: 'PATCH', headers: { ...headers(), 'Prefer': 'return=representation' }, body: JSON.stringify(data) }); if (!r.ok) throw new Error(await r.text()); return r.json(); }
async function dbDelete(id)       { const r = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?id=eq.${id}`, { method: 'DELETE', headers: headers() }); if (!r.ok) throw new Error(await r.text()); }

// ============================================================
// MAP DB ROW → DISPLAY OBJECT
// ============================================================
function mapRow(s) {
  if (!s) return null;
  const iucn = mapStatus(s.conservation_status);
  return {
    id: s.id,
    sci: s.scientific_name || '',
    author: '',
    family: s.family || 'Dipterocarpaceae',
    genus: s.genus || '',
    common: [s.local_name_malay, s.maksud_epitet].filter(Boolean),
    iucn,
    conservation_status: s.conservation_status || '',
    endemic: !!s.endemic_to_malaysia,
    height: s.height_range || '—',
    dbh: s.trunk_diameter || '—',
    habit: s.habitat || '—',
    distribution: [
      s.distribution_peninsular && 'Peninsular Malaysia',
      s.distribution_sabah      && 'Sabah',
      s.distribution_sarawak    && 'Sarawak',
    ].filter(Boolean),
    altitude: s.elevation_range || '—',
    habitat: s.habitat || '—',
    phenology: s.flowering_pattern || '—',
    description: [s.bark_description, s.leaf_description].filter(Boolean).join(' ') || '—',
    uses: s.economic_importance || '—',
    ecological_notes: s.ecological_notes || '',
    threats: [],
    photos: 0, contributors: 0, lastUpdated: '—',
    similar: [],
    _raw: s,
  };
}

function mapStatus(str) {
  if (!str) return 'DD';
  const s = str.toLowerCase();
  if (s.includes('critically')) return 'CR';
  if (s.includes('endangered')) return 'EN';
  if (s.includes('vulnerable')) return 'VU';
  if (s.includes('near'))       return 'NT';
  if (s.includes('least'))      return 'LC';
  return 'DD';
}

// ============================================================
// CONSTANTS
// ============================================================
const STATUS = {
  CR: { label: "Critically Endangered", short: "CR", c: "#B91C1C", bg: "#FEE2E2" },
  EN: { label: "Endangered",            short: "EN", c: "#C2410C", bg: "#FFEDD5" },
  VU: { label: "Vulnerable",            short: "VU", c: "#A16207", bg: "#FEF3C7" },
  NT: { label: "Near Threatened",       short: "NT", c: "#65A30D", bg: "#ECFCCB" },
  LC: { label: "Least Concern",         short: "LC", c: "#047857", bg: "#D1FAE5" },
  DD: { label: "Data Deficient",        short: "DD", c: "#525252", bg: "#F4F4F4" },
  NE: { label: "Not Evaluated",         short: "NE", c: "#737373", bg: "#F4F4F4" },
};

const REGIONS = ["Peninsular Malaysia","Sabah","Sarawak"];

// ============================================================
// ICONS
// ============================================================
const Icon = {
  search: (p={}) => (<svg width={p.s||16} height={p.s||16} viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5" stroke="currentColor" strokeWidth="1.5"/><path d="M11 11l3.5 3.5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg>),
  arrow:  (p={}) => (<svg width={p.s||14} height={p.s||14} viewBox="0 0 14 14" style={{transform:p.dir==="left"?"rotate(180deg)":""}} fill="none"><path d="M2 7h10M8 3l4 4-4 4" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>),
  upload: (p={}) => (<svg width={p.s||16} height={p.s||16} viewBox="0 0 16 16" fill="none"><path d="M8 11V2M5 5l3-3 3 3M2.5 13.5h11" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>),
  close:  (p={}) => (<svg width={p.s||14} height={p.s||14} viewBox="0 0 14 14" fill="none"><path d="M3 3l8 8M11 3l-8 8" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg>),
  check:  (p={}) => (<svg width={p.s||12} height={p.s||12} viewBox="0 0 12 12" fill="none"><path d="M2.5 6.5l2.5 2.5 4.5-5.5" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></svg>),
  pin:    (p={}) => (<svg width={p.s||12} height={p.s||14} viewBox="0 0 12 14" fill="none"><path d="M6 1c2.5 0 4.5 2 4.5 4.5C10.5 9 6 13 6 13S1.5 9 1.5 5.5C1.5 3 3.5 1 6 1z" stroke="currentColor" strokeWidth="1.4"/><circle cx="6" cy="5.5" r="1.5" fill="currentColor"/></svg>),
  camera: (p={}) => (<svg width={p.s||16} height={p.s||16} viewBox="0 0 16 16" fill="none"><rect x="1.5" y="4" width="13" height="9" rx="1.5" stroke="currentColor" strokeWidth="1.5"/><path d="M5.5 4l1-1.5h3l1 1.5" stroke="currentColor" strokeWidth="1.5"/><circle cx="8" cy="8.5" r="2.5" stroke="currentColor" strokeWidth="1.5"/></svg>),
  grid:   (p={}) => (<svg width={p.s||14} height={p.s||14} viewBox="0 0 14 14" fill="none"><rect x="1" y="1" width="5" height="5" rx="1" stroke="currentColor" strokeWidth="1.4"/><rect x="8" y="1" width="5" height="5" rx="1" stroke="currentColor" strokeWidth="1.4"/><rect x="1" y="8" width="5" height="5" rx="1" stroke="currentColor" strokeWidth="1.4"/><rect x="8" y="8" width="5" height="5" rx="1" stroke="currentColor" strokeWidth="1.4"/></svg>),
  list:   (p={}) => (<svg width={p.s||14} height={p.s||14} viewBox="0 0 14 14" fill="none"><path d="M1 3.5h12M1 7h12M1 10.5h12" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/></svg>),
  leaf:   (p={}) => (<svg width={p.s||16} height={p.s||16} viewBox="0 0 16 16" fill="none"><path d="M2 14C2 7 7 2 14 2C14 9 9 14 2 14Z" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round"/><path d="M2 14L9 7" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg>),
  chev:   (p={}) => (<svg width={p.s||12} height={p.s||12} viewBox="0 0 12 12" style={{transform:p.up?"rotate(180deg)":""}} fill="none"><path d="M3 4.5l3 3 3-3" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></svg>),
  plus:   (p={}) => (<svg width={p.s||14} height={p.s||14} viewBox="0 0 14 14" fill="none"><path d="M7 2v10M2 7h10" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/></svg>),
  edit:   (p={}) => (<svg width={p.s||14} height={p.s||14} viewBox="0 0 14 14" fill="none"><path d="M2 10l7-7 2 2-7 7H2v-2z" stroke="currentColor" strokeWidth="1.4" strokeLinejoin="round"/><path d="M8 4l2 2" stroke="currentColor" strokeWidth="1.4"/></svg>),
  trash:  (p={}) => (<svg width={p.s||14} height={p.s||14} viewBox="0 0 14 14" fill="none"><path d="M2 4h10M5 4V2.5h4V4M5.5 6.5v4M8.5 6.5v4M3 4l.7 7.5h6.6L11 4" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/></svg>),
  lock:   (p={}) => (<svg width={p.s||14} height={p.s||14} viewBox="0 0 14 14" fill="none"><rect x="2.5" y="6" width="9" height="7" rx="1.5" stroke="currentColor" strokeWidth="1.4"/><path d="M4.5 6V4a2.5 2.5 0 015 0v2" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/></svg>),
};

// ============================================================
// ATOMS
// ============================================================
function Photo({ caption, ratio, seed=0, rounded=true }) {
  const hue = 80 + (seed * 13) % 60;
  return (
    <div style={{
      width:"100%", aspectRatio: ratio||"4/3",
      background:`linear-gradient(135deg, hsl(${hue},18%,88%), hsl(${hue+20},22%,78%))`,
      position:"relative", overflow:"hidden",
      borderRadius: rounded ? "var(--radius)" : 0,
      border:"1px solid var(--border)",
    }}>
      <div style={{ position:"absolute",inset:0,
        backgroundImage:`radial-gradient(circle at 30% 70%, hsla(${hue+30},35%,55%,0.45),transparent 55%), radial-gradient(circle at 75% 35%, hsla(${hue-10},25%,75%,0.55),transparent 50%)`}}/>
      {caption && <div style={{ position:"absolute",left:10,bottom:8,
        fontFamily:"var(--mono)",fontSize:10,color:"rgba(20,30,25,0.65)",
        background:"rgba(255,255,255,0.7)",padding:"2px 6px",borderRadius:4,
        backdropFilter:"blur(4px)",letterSpacing:"0.02em"}}>{caption}</div>}
    </div>
  );
}

function Pill({ status, size }) {
  const m = STATUS[status] || STATUS.NE;
  const sm = size === "sm";
  return (
    <span style={{display:"inline-flex",alignItems:"center",gap:4,
      padding:sm?"1px 6px":"2px 8px",fontSize:sm?11:12,fontWeight:500,
      background:m.bg,color:m.c,borderRadius:999,lineHeight:1.5,
      border:`1px solid ${m.c}22`}}>
      <span style={{width:5,height:5,borderRadius:999,background:m.c}}/>
      {m.short}
    </span>
  );
}

function Btn({ children, variant="primary", size="md", icon, iconRight, onClick, disabled, full, type }) {
  const v = {
    primary:   { bg:"var(--text)",      c:"var(--bg)",    border:"var(--text)" },
    secondary: { bg:"var(--surface)",   c:"var(--text)",  border:"var(--border-strong)" },
    ghost:     { bg:"transparent",      c:"var(--text)",  border:"transparent" },
    accent:    { bg:"var(--accent)",    c:"white",        border:"var(--accent)" },
    danger:    { bg:"transparent",      c:"var(--danger)",border:"transparent" },
  }[variant];
  const p = { sm:"6px 10px", md:"8px 14px", lg:"11px 18px" }[size];
  return (
    <button type={type||"button"} disabled={disabled} onClick={onClick} style={{
      display:"inline-flex",alignItems:"center",justifyContent:"center",gap:6,padding:p,
      background:disabled?"var(--surface-2)":v.bg,
      color:disabled?"var(--text-3)":v.c,
      border:`1px solid ${disabled?"var(--border)":v.border}`,
      borderRadius:"var(--radius-sm)",fontSize:size==="sm"?13:14,fontWeight:500,
      cursor:disabled?"not-allowed":"pointer",transition:"all 0.12s",
      width:full?"100%":undefined,whiteSpace:"nowrap",
    }}
    onMouseEnter={e=>{ if(!disabled&&variant==="primary") e.currentTarget.style.opacity="0.88"; }}
    onMouseLeave={e=>{ e.currentTarget.style.opacity="1"; }}>
      {icon}{children}{iconRight}
    </button>
  );
}

function Input({ value, onChange, placeholder, type, icon, full=true }) {
  return (
    <div style={{display:"flex",alignItems:"center",gap:8,padding:"9px 12px",
      background:"var(--surface)",border:"1px solid var(--border-strong)",
      borderRadius:"var(--radius-sm)",width:full?"100%":undefined}}>
      {icon && <span style={{color:"var(--text-3)",display:"flex"}}>{icon}</span>}
      <input type={type||"text"} value={value} onChange={onChange} placeholder={placeholder}
        style={{flex:1,background:"none",border:"none",outline:"none",fontSize:14,color:"var(--text)"}}/>
    </div>
  );
}

function Toast({ msg, isError }) {
  if (!msg) return null;
  return (
    <div style={{position:"fixed",bottom:24,right:24,zIndex:9999,
      background:isError?"#B91C1C":"var(--accent)",color:"white",
      padding:"10px 18px",borderRadius:"var(--radius-sm)",fontSize:13,fontWeight:500,
      boxShadow:"var(--shadow)",animation:"fadeIn .2s ease"}}>
      {msg}
    </div>
  );
}

function TopBar({ route, setRoute, query, setQuery, onSearch, isAdmin, setShowLogin, setShowAdmin }) {
  const navItems = [
    { id:"browse",     label:"Layari Laman" },
    { id:"contribute", label:"Kongsi Foto" },
    { id:"about",      label:"About" },
  ];
  return (
    <header style={{position:"sticky",top:0,zIndex:50,
      background:"color-mix(in srgb, var(--bg) 92%, transparent)",
      backdropFilter:"blur(12px)",borderBottom:"1px solid var(--border)"}}>
      <div style={{maxWidth:1280,margin:"0 auto",padding:"12px 32px",display:"flex",alignItems:"center",gap:24}}>
        <button onClick={()=>setRoute("home")} style={{background:"none",border:"none",padding:0,cursor:"pointer",display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:28,height:28,borderRadius:7,background:"var(--accent)",display:"flex",alignItems:"center",justifyContent:"center",color:"white"}}>
            <Icon.leaf s={16}/>
          </div>
          <span style={{fontWeight:600,fontSize:15,letterSpacing:"-0.01em"}}>Dipterokarp Malaysia</span>
        </button>
        <span style={{width:1,height:20,background:"var(--border)"}}/>
        <nav style={{display:"flex",gap:4}}>
          {navItems.map(it=>(
            <button key={it.id} onClick={()=>setRoute(it.id)} style={{
              background:route===it.id?"var(--surface-2)":"transparent",
              color:route===it.id?"var(--text)":"var(--text-2)",
              border:"none",padding:"7px 12px",borderRadius:6,
              fontSize:13,fontWeight:500,cursor:"pointer"}}>{it.label}</button>
          ))}
        </nav>
        <div style={{flex:1,maxWidth:460,marginLeft:16}}>
          <form onSubmit={e=>{e.preventDefault();onSearch();}}>
            <Input value={query} onChange={e=>setQuery(e.target.value)}
              placeholder="Cari nama saintifik, nama Melayu, genus…"
              icon={<Icon.search s={15}/>}/>
          </form>
        </div>
        <div style={{flex:1}}/>
        {isAdmin ? (
          <div style={{display:"flex",gap:8,alignItems:"center"}}>
            <span style={{fontSize:12,color:"var(--accent)",fontWeight:500}}>Admin</span>
            <Btn variant="secondary" size="sm" onClick={()=>setRoute("approvals")}>Kelulusan Foto</Btn>
            <Btn variant="secondary" size="sm" icon={<Icon.plus s={12}/>} onClick={()=>setShowAdmin(true)}>Urus Spesies</Btn>
          </div>
        ) : (
          <>
            <Btn variant="accent" size="sm" icon={<Icon.camera s={14}/>} onClick={()=>setRoute("contribute")}>Kongsi</Btn>
            <Btn variant="ghost" size="sm" icon={<Icon.lock s={13}/>} onClick={()=>setShowLogin(true)}>Admin</Btn>
          </>
        )}
      </div>
    </header>
  );
}

// ============================================================
// HOME
// ============================================================
function Home({ species, loading, setRoute, setSpeciesId, setQuery, onSearch }) {
  const [heroQ, setHeroQ] = useState("");
  const popular = ["Shorea","Dipterocarpus","Hopea","Vatica","Meranti","Keruing"];
  const featured = species.slice(0,3);
  const recent   = species.slice(3,7);

  const submit = q => { setQuery(q); setRoute("browse"); };

  const genera = [...new Set(species.map(s=>s.genus).filter(Boolean))].length;
  const vuCount = species.filter(s=>["CR","EN","VU"].includes(s.iucn)).length;
  const endemicCount = species.filter(s=>s.endemic).length;

  return (
    <div style={{maxWidth:1280,margin:"0 auto",padding:"64px 32px 32px"}}>
      {/* Hero */}
      <section style={{textAlign:"center",maxWidth:760,margin:"0 auto 80px"}}>
        <div style={{display:"inline-flex",alignItems:"center",gap:8,padding:"5px 12px",
          background:"var(--accent-2)",color:"var(--accent)",borderRadius:999,fontSize:12,fontWeight:500,marginBottom:24}}>
          <span style={{width:6,height:6,borderRadius:999,background:"var(--accent)"}}/>
          {loading ? "Memuatkan…" : `${species.length} spesies · Dipterocarpaceae · data terbuka`}
        </div>
        <h1 style={{fontSize:56,lineHeight:1.05,fontWeight:600,letterSpacing:"-0.03em",margin:"0 0 20px",textWrap:"balance"}}>
          Dipterokarp Malaysia, dalam satu arkib carian.
        </h1>
        <p style={{fontSize:18,color:"var(--text-2)",lineHeight:1.55,margin:"0 auto 32px",maxWidth:600,textWrap:"pretty"}}>
          Huraian taksonomi, status pemuliharaan IUCN, dan maklumat taburan spesies Dipterocarpaceae Malaysia.
        </p>
        <form onSubmit={e=>{e.preventDefault();submit(heroQ);}} style={{maxWidth:580,margin:"0 auto"}}>
          <div style={{display:"flex",alignItems:"center",gap:8,padding:"8px 8px 8px 16px",
            background:"var(--surface)",border:"1px solid var(--border-strong)",
            borderRadius:12,boxShadow:"var(--shadow)"}}>
            <Icon.search s={18}/>
            <input value={heroQ} onChange={e=>setHeroQ(e.target.value)}
              placeholder="Cuba: Shorea, Meranti, Keruing, Hopea…"
              style={{flex:1,background:"none",border:"none",outline:"none",fontSize:16,padding:"8px 0"}}/>
            <Btn variant="primary" size="md" type="submit">Cari</Btn>
          </div>
          <div style={{display:"flex",gap:6,justifyContent:"center",marginTop:16,flexWrap:"wrap"}}>
            <span style={{fontSize:12,color:"var(--text-3)",marginRight:4,alignSelf:"center"}}>Popular:</span>
            {popular.map(p=>(
              <button key={p} onClick={()=>submit(p)} style={{
                background:"var(--surface)",border:"1px solid var(--border)",
                borderRadius:999,padding:"4px 10px",fontSize:12,color:"var(--text-2)",cursor:"pointer"}}>{p}</button>
            ))}
          </div>
        </form>
      </section>

      {/* Stats */}
      <section style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:0,marginBottom:80,
        background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12,overflow:"hidden"}}>
        {[
          [loading?"…":species.length, "Spesies dikatalog"],
          [loading?"…":genera,         "Genus"],
          [loading?"…":endemicCount,   "Endemik Malaysia"],
          [loading?"…":vuCount,        "Terancam (IUCN)"],
        ].map(([n,l],i)=>(
          <div key={i} style={{padding:"24px 28px",borderRight:i<3?"1px solid var(--border)":"none"}}>
            <div style={{fontSize:32,fontWeight:600,letterSpacing:"-0.02em"}}>{n}</div>
            <div style={{fontSize:13,color:"var(--text-2)",marginTop:4}}>{l}</div>
          </div>
        ))}
      </section>

      {/* Featured */}
      {!loading && featured.length > 0 && (
        <section style={{marginBottom:80}}>
          <div style={{display:"flex",alignItems:"baseline",justifyContent:"space-between",marginBottom:24}}>
            <h2 style={{fontSize:24,fontWeight:600,margin:0,letterSpacing:"-0.01em"}}>Spesies ikonik</h2>
            <button onClick={()=>setRoute("browse")} style={{background:"none",border:"none",color:"var(--text-2)",fontSize:13,cursor:"pointer",display:"inline-flex",alignItems:"center",gap:4}}>
              Lihat semua <Icon.arrow s={12}/>
            </button>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:16}}>
            {featured.map((s,i)=>(<Card key={s.id} s={s} i={i} onClick={()=>{setSpeciesId(s.id);setRoute("detail");}}/>))}
          </div>
        </section>
      )}

      {/* How it works */}
      <section style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:16,marginBottom:80}}>
        {[
          { n:"01", t:"Cari & layari", d:"Cari spesies menggunakan nama saintifik, genus, famili, atau nama Melayu." },
          { n:"02", t:"Baca rekod", d:"Taksonomi penuh, huraian, taburan mengikut negeri, dan status pemuliharaan berganda." },
          { n:"03", t:"Dipterocarpaceae", d:"Pangkalan data khusus famili Dipterocarpaceae — meranti, keruing, resak, dan lebih banyak lagi." },
        ].map(({n,t,d})=>(
          <div key={n} style={{padding:24,background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12}}>
            <div style={{fontFamily:"var(--mono)",fontSize:12,color:"var(--text-3)",marginBottom:12}}>{n}</div>
            <h3 style={{fontSize:16,fontWeight:600,margin:"0 0 8px"}}>{t}</h3>
            <p style={{fontSize:14,color:"var(--text-2)",margin:0,lineHeight:1.55}}>{d}</p>
          </div>
        ))}
      </section>

      {/* Recent */}
      {!loading && recent.length > 0 && (
        <section style={{marginBottom:32}}>
          <h2 style={{fontSize:24,fontWeight:600,margin:"0 0 20px",letterSpacing:"-0.01em"}}>Entri terbaru</h2>
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:16}}>
            {recent.map((s,i)=>(
              <button key={s.id} onClick={()=>{setSpeciesId(s.id);setRoute("detail");}}
                style={{background:"none",border:"none",padding:0,textAlign:"left",cursor:"pointer"}}>
                <Photo caption={s.common[0]||s.genus} seed={i+20} ratio="1/1"/>
                <div style={{marginTop:10,fontSize:14,fontWeight:500,fontStyle:"italic"}}>{s.sci}</div>
                <div style={{fontSize:12,color:"var(--text-3)",marginTop:2}}>{s.family}</div>
              </button>
            ))}
          </div>
        </section>
      )}

      {loading && (
        <div style={{textAlign:"center",padding:"80px 0",color:"var(--text-3)"}}>
          <div style={{width:32,height:32,border:"2px solid var(--border)",borderTopColor:"var(--accent)",
            borderRadius:"50%",animation:"spin .8s linear infinite",margin:"0 auto 16px"}}/>
          Memuatkan data dari Supabase…
        </div>
      )}
    </div>
  );
}

function Card({ s, i, onClick }) {
  const [hover, setHover] = useState(false);
  return (
    <button onClick={onClick} onMouseEnter={()=>setHover(true)} onMouseLeave={()=>setHover(false)}
      style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12,
        padding:0,cursor:"pointer",textAlign:"left",overflow:"hidden",transition:"all 0.15s",
        boxShadow:hover?"var(--shadow)":"var(--shadow-sm)",
        transform:hover?"translateY(-2px)":"none"}}>
      <div style={{padding:8,paddingBottom:0}}>
        <Photo caption={s.common[0]||s.genus} seed={i+5} ratio="4/3"/>
      </div>
      <div style={{padding:16}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,marginBottom:8}}>
          <span style={{fontSize:11,color:"var(--text-3)",fontFamily:"var(--mono)"}}>{s.family}</span>
          <div style={{display:"flex",gap:4}}>
            <Pill status={s.iucn} size="sm"/>
            {s.endemic && <span style={{fontSize:11,padding:"1px 6px",background:"var(--text)",color:"var(--bg)",borderRadius:999}}>Endemik</span>}
          </div>
        </div>
        <div style={{fontSize:17,fontWeight:500,fontStyle:"italic",lineHeight:1.2,marginBottom:4}}>{s.sci}</div>
        <div style={{fontSize:13,color:"var(--text-2)"}}>{s.common[0] || s.genus}</div>
      </div>
    </button>
  );
}

// ============================================================
// BROWSE
// ============================================================
function Browse({ species, query, setQuery, setRoute, setSpeciesId }) {
  const [view, setView] = useState("grid");
  const [filters, setFilters] = useState({ genus:[], iucn:[], region:[], endemic:false });
  const [sort, setSort] = useState("name");

  const allGenera = useMemo(()=>[...new Set(species.map(s=>s.genus).filter(Boolean))].sort(),[species]);

  const filtered = useMemo(()=>{
    let r = species;
    if (query) {
      const q = query.toLowerCase().trim();
      r = r.filter(s =>
        s.sci.toLowerCase().includes(q) ||
        s.genus.toLowerCase().includes(q) ||
        s.family.toLowerCase().includes(q) ||
        s.common.some(c=>c.toLowerCase().includes(q))
      );
    }
    if (filters.genus.length)  r = r.filter(s=>filters.genus.includes(s.genus));
    if (filters.iucn.length)   r = r.filter(s=>filters.iucn.includes(s.iucn));
    if (filters.region.length) r = r.filter(s=>filters.region.some(rg=>s.distribution.includes(rg)));
    if (filters.endemic)       r = r.filter(s=>s.endemic);
    if (sort==="name")   r=[...r].sort((a,b)=>a.sci.localeCompare(b.sci));
    if (sort==="status") { const o=["CR","EN","VU","NT","LC","DD","NE"]; r=[...r].sort((a,b)=>o.indexOf(a.iucn)-o.indexOf(b.iucn)); }
    return r;
  },[species,query,filters,sort]);

  const toggle = (k,v) => setFilters(f=>({...f,[k]:f[k].includes(v)?f[k].filter(x=>x!==v):[...f[k],v]}));
  const activeCount = filters.genus.length+filters.iucn.length+filters.region.length+(filters.endemic?1:0);

  return (
    <div style={{maxWidth:1280,margin:"0 auto",padding:"32px"}}>
      <div style={{marginBottom:24}}>
        <h1 style={{fontSize:28,fontWeight:600,margin:0,letterSpacing:"-0.02em"}}>Layari katalog</h1>
        <p style={{fontSize:14,color:"var(--text-2)",margin:"6px 0 0"}}>
          {filtered.length} spesies
          {query && <> sepadan "<span style={{color:"var(--text)"}}>{query}</span>"</>}
          {activeCount>0 && <> · {activeCount} penapis digunakan</>}
        </p>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"220px 1fr",gap:32}}>
        {/* Filters */}
        <aside>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12,paddingBottom:12,borderBottom:"1px solid var(--border)"}}>
            <span style={{fontSize:13,fontWeight:600}}>Penapis</span>
            {activeCount>0 && <button onClick={()=>setFilters({genus:[],iucn:[],region:[],endemic:false})}
              style={{background:"none",border:"none",color:"var(--accent)",fontSize:12,cursor:"pointer"}}>Kosongkan</button>}
          </div>

          <FilterGroup title="Status IUCN" defaultOpen>
            {["CR","EN","VU","NT","LC","DD"].map(c=>(
              <Check key={c} checked={filters.iucn.includes(c)} onClick={()=>toggle("iucn",c)}>
                <Pill status={c} size="sm"/>
                <span style={{marginLeft:"auto",fontSize:12,color:"var(--text-3)"}}>{species.filter(s=>s.iucn===c).length}</span>
              </Check>
            ))}
          </FilterGroup>

          <FilterGroup title="Genus" defaultOpen>
            {allGenera.map(g=>(
              <Check key={g} checked={filters.genus.includes(g)} onClick={()=>toggle("genus",g)}>
                <span style={{fontSize:13,fontStyle:"italic"}}>{g}</span>
                <span style={{marginLeft:"auto",fontSize:12,color:"var(--text-3)"}}>{species.filter(s=>s.genus===g).length}</span>
              </Check>
            ))}
          </FilterGroup>

          <FilterGroup title="Taburan">
            {REGIONS.map(rg=>(
              <Check key={rg} checked={filters.region.includes(rg)} onClick={()=>toggle("region",rg)}>
                <span style={{fontSize:13}}>{rg}</span>
              </Check>
            ))}
          </FilterGroup>

          <FilterGroup title="Lain-lain" defaultOpen>
            <Check checked={filters.endemic} onClick={()=>setFilters(f=>({...f,endemic:!f.endemic}))}>
              <span style={{fontSize:13}}>Endemik Malaysia</span>
            </Check>
          </FilterGroup>
        </aside>

        {/* Results */}
        <main>
          <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:16}}>
            <Input value={query} onChange={e=>setQuery(e.target.value)}
              placeholder="Cari nama saintifik, genus, nama Melayu…"
              icon={<Icon.search s={15}/>}/>
            <select value={sort} onChange={e=>setSort(e.target.value)}
              style={{background:"var(--surface)",border:"1px solid var(--border-strong)",
                borderRadius:"var(--radius-sm)",padding:"9px 12px",fontSize:13,color:"var(--text)",cursor:"pointer"}}>
              <option value="name">A → Z</option>
              <option value="status">Paling terancam</option>
            </select>
            <div style={{display:"flex",border:"1px solid var(--border-strong)",borderRadius:"var(--radius-sm)",overflow:"hidden"}}>
              <button onClick={()=>setView("grid")} style={{background:view==="grid"?"var(--text)":"var(--surface)",color:view==="grid"?"var(--bg)":"var(--text-2)",border:"none",padding:"9px 11px",cursor:"pointer",display:"flex",alignItems:"center"}}><Icon.grid/></button>
              <button onClick={()=>setView("list")} style={{background:view==="list"?"var(--text)":"var(--surface)",color:view==="list"?"var(--bg)":"var(--text-2)",border:"none",padding:"9px 11px",cursor:"pointer",display:"flex",alignItems:"center",borderLeft:"1px solid var(--border-strong)"}}><Icon.list/></button>
            </div>
          </div>

          {/* active chips */}
          {activeCount>0 && (
            <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:16}}>
              {[...filters.genus.map(v=>["genus",v]),...filters.iucn.map(v=>["iucn",v]),...filters.region.map(v=>["region",v])].map(([k,v])=>(
                <button key={k+v} onClick={()=>toggle(k,v)} style={{display:"inline-flex",alignItems:"center",gap:6,padding:"3px 4px 3px 10px",background:"var(--surface)",border:"1px solid var(--border)",borderRadius:999,fontSize:12,cursor:"pointer",color:"var(--text)"}}>
                  <span style={{color:"var(--text-3)",fontSize:11}}>{k}:</span>{v}
                  <span style={{width:18,height:18,borderRadius:999,background:"var(--surface-2)",display:"inline-flex",alignItems:"center",justifyContent:"center"}}><Icon.close s={10}/></span>
                </button>
              ))}
              {filters.endemic && <button onClick={()=>setFilters(f=>({...f,endemic:false}))} style={{display:"inline-flex",alignItems:"center",gap:6,padding:"3px 4px 3px 10px",background:"var(--surface)",border:"1px solid var(--border)",borderRadius:999,fontSize:12,cursor:"pointer"}}>
                Endemik <span style={{width:18,height:18,borderRadius:999,background:"var(--surface-2)",display:"inline-flex",alignItems:"center",justifyContent:"center"}}><Icon.close s={10}/></span>
              </button>}
            </div>
          )}

          {filtered.length===0 ? (
            <div style={{padding:64,textAlign:"center",background:"var(--surface)",border:"1px dashed var(--border-strong)",borderRadius:12}}>
              <div style={{fontSize:16,fontWeight:500,marginBottom:6}}>Tiada spesies sepadan</div>
              <div style={{fontSize:13,color:"var(--text-2)",marginBottom:16}}>Cuba carian lebih luas atau kosongkan penapis.</div>
              <Btn variant="secondary" onClick={()=>{setQuery("");setFilters({genus:[],iucn:[],region:[],endemic:false});}}>Tetapkan semula</Btn>
            </div>
          ) : view==="grid" ? (
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:16}}>
              {filtered.map((s,i)=>(<Card key={s.id} s={s} i={i} onClick={()=>{setSpeciesId(s.id);setRoute("detail");}}/>))}
            </div>
          ) : (
            <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12,overflow:"hidden"}}>
              <div style={{display:"grid",gridTemplateColumns:"50px 1.6fr 1fr 0.8fr 70px 70px",padding:"10px 16px",borderBottom:"1px solid var(--border)",background:"var(--surface-2)",fontSize:11,fontWeight:500,color:"var(--text-3)",textTransform:"uppercase",letterSpacing:"0.04em"}}>
                <div/><div>Spesies</div><div>Nama Melayu</div><div>Genus</div><div>IUCN</div><div>Taburan</div>
              </div>
              {filtered.map((s,i)=>(
                <button key={s.id} onClick={()=>{setSpeciesId(s.id);setRoute("detail");}}
                  style={{display:"grid",gridTemplateColumns:"50px 1.6fr 1fr 0.8fr 70px 70px",padding:"12px 16px",width:"100%",background:"none",border:"none",borderTop:i>0?"1px solid var(--border)":"none",textAlign:"left",cursor:"pointer",alignItems:"center",color:"var(--text)"}}
                  onMouseEnter={e=>e.currentTarget.style.background="var(--surface-2)"}
                  onMouseLeave={e=>e.currentTarget.style.background="none"}>
                  <div style={{width:38,height:38,borderRadius:6,overflow:"hidden"}}><Photo seed={i} ratio="1/1" rounded={false}/></div>
                  <div>
                    <div style={{fontSize:14,fontStyle:"italic",fontWeight:500}}>{s.sci}</div>
                    <div style={{fontSize:11,color:"var(--text-3)",fontFamily:"var(--mono)"}}>{s.family}</div>
                  </div>
                  <div style={{fontSize:13}}>{s.common[0]||"—"}</div>
                  <div style={{fontSize:13,fontStyle:"italic",color:"var(--text-2)"}}>{s.genus}</div>
                  <div><Pill status={s.iucn} size="sm"/></div>
                  <div style={{fontSize:12,color:"var(--text-3)"}}>{s.distribution.map(d=>d.replace("Peninsular Malaysia","Pen.")).join(", ") || "—"}</div>
                </button>
              ))}
            </div>
          )}
        </main>
      </div>
    </div>
  );
}

function FilterGroup({ title, children, defaultOpen }) {
  const [open, setOpen] = useState(!!defaultOpen);
  return (
    <div style={{borderBottom:"1px solid var(--border)",padding:"12px 0"}}>
      <button onClick={()=>setOpen(o=>!o)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",width:"100%",background:"none",border:"none",padding:0,cursor:"pointer",color:"var(--text)"}}>
        <span style={{fontSize:13,fontWeight:500}}>{title}</span>
        <Icon.chev up={open}/>
      </button>
      {open && <div style={{marginTop:10,display:"flex",flexDirection:"column",gap:4}}>{children}</div>}
    </div>
  );
}

function Check({ checked, onClick, children }) {
  return (
    <button onClick={onClick} style={{display:"flex",alignItems:"center",gap:8,width:"100%",padding:"5px 0",background:"none",border:"none",cursor:"pointer",color:"var(--text)",textAlign:"left"}}>
      <span style={{width:16,height:16,borderRadius:4,flexShrink:0,border:"1.5px solid "+(checked?"var(--text)":"var(--border-strong)"),background:checked?"var(--text)":"transparent",color:"var(--bg)",display:"flex",alignItems:"center",justifyContent:"center"}}>{checked && <Icon.check s={10}/>}</span>
      <span style={{flex:1,display:"inline-flex",alignItems:"center",gap:6}}>{children}</span>
    </button>
  );
}

// ============================================================
// DETAIL
// ============================================================
function Detail({ species, speciesId, setSpeciesId, setRoute, setQuery }) {
  const s = species.find(x=>x.id===speciesId) || species[0];
  const [tab, setTab] = useState("overview");
  const [activePhoto, setActivePhoto] = useState(0);

  if (!s) return <div style={{padding:64,textAlign:"center",color:"var(--text-3)"}}>Spesies tidak dijumpai.</div>;

  const raw = s._raw;

  return (
    <div style={{maxWidth:1100,margin:"0 auto",padding:"24px 32px 64px"}}>
      {/* Breadcrumb */}
      <div style={{display:"flex",alignItems:"center",gap:8,fontSize:13,color:"var(--text-3)",marginBottom:24}}>
        <button onClick={()=>setRoute("home")} style={{background:"none",border:"none",color:"var(--text-3)",cursor:"pointer",padding:0,fontSize:13}}>Laman Utama</button>
        <span>/</span>
        <button onClick={()=>setRoute("browse")} style={{background:"none",border:"none",color:"var(--text-3)",cursor:"pointer",padding:0,fontSize:13}}>Layari</button>
        <span>/</span>
        <button onClick={()=>{setQuery(s.genus);setRoute("browse");}} style={{background:"none",border:"none",color:"var(--text-3)",cursor:"pointer",padding:0,fontSize:13,fontStyle:"italic"}}>{s.genus}</button>
        <span>/</span>
        <span style={{color:"var(--text)",fontStyle:"italic"}}>{s.sci}</span>
      </div>

      {/* Hero grid */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:32,marginBottom:40}}>
        <div>
          <Photo caption={["habit","daun","kulit","buah"][activePhoto]} seed={species.indexOf(s)*7+activePhoto*3} ratio="4/3"/>
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,marginTop:8}}>
            {[0,1,2,3].map(i=>(
              <button key={i} onClick={()=>setActivePhoto(i)} style={{aspectRatio:"1/1",padding:0,cursor:"pointer",overflow:"hidden",borderRadius:"var(--radius)",border:"2px solid "+(activePhoto===i?"var(--text)":"transparent"),background:"none"}}>
                <Photo caption={["habit","daun","kulit","buah"][i]} seed={species.indexOf(s)*7+i*3} ratio="1/1" rounded={false}/>
              </button>
            ))}
          </div>
        </div>

        <div>
          <div style={{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap"}}>
            <span style={{fontSize:11,padding:"2px 8px",background:"var(--surface)",border:"1px solid var(--border)",borderRadius:999,color:"var(--text-2)",fontFamily:"var(--mono)"}}>{s.family}</span>
            {s.endemic && <span style={{fontSize:11,padding:"2px 8px",background:"var(--text)",color:"var(--bg)",borderRadius:999,fontWeight:500}}>Endemik Malaysia</span>}
          </div>
          <h1 style={{fontSize:40,fontWeight:500,fontStyle:"italic",letterSpacing:"-0.025em",margin:0,lineHeight:1.05}}>{s.sci}</h1>

          {s.common.length>0 && (
            <div style={{marginTop:20}}>
              <div style={{fontSize:12,color:"var(--text-3)",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:6}}>Nama tempatan</div>
              <div style={{fontSize:16}}>
                {s.common.map((c,i)=>(<span key={c}>{c}{i<s.common.length-1&&<span style={{color:"var(--text-3)"}}> · </span>}</span>))}
              </div>
            </div>
          )}

          <div style={{marginTop:24,padding:16,background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12}}>
            <div style={{fontSize:12,color:"var(--text-3)",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:12}}>Status pemuliharaan</div>
            <div>
              <div style={{fontSize:12,color:"var(--text-2)",marginBottom:4}}>IUCN / {s.conservation_status}</div>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <Pill status={s.iucn}/>
                <span style={{fontSize:13,color:"var(--text-2)"}}>{STATUS[s.iucn]?.label}</span>
              </div>
            </div>
          </div>

          <div style={{marginTop:24,display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12}}>
            {[["Tabiat",s.habit],["Ketinggian",s.height],["Diameter",s.dbh]].map(([k,v])=>(
              <div key={k}>
                <div style={{fontSize:11,color:"var(--text-3)",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:4}}>{k}</div>
                <div style={{fontSize:14}}>{v}</div>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* Tabs */}
      <div style={{borderBottom:"1px solid var(--border)",display:"flex",gap:24,marginBottom:32}}>
        {[["overview","Gambaran Keseluruhan"],["taxonomy","Taksonomi"],["distribution","Taburan"],["morphology","Morfologi"]].map(([id,l])=>(
          <button key={id} onClick={()=>setTab(id)} style={{background:"none",border:"none",padding:"10px 0",fontSize:14,fontWeight:500,color:tab===id?"var(--text)":"var(--text-2)",borderBottom:"2px solid "+(tab===id?"var(--text)":"transparent"),marginBottom:-1,cursor:"pointer"}}>{l}</button>
        ))}
      </div>

      {tab==="overview" && (
        <div style={{display:"grid",gridTemplateColumns:"1fr 280px",gap:48}}>
          <div>
            {s.description && s.description!=="—" && (
              <Section title="Huraian / Description">
                <p style={{fontSize:15,lineHeight:1.7,color:"var(--text)",margin:0}}>{s.description}</p>
              </Section>
            )}
            <Section title="Habitat & Ekologi">
              <DataPair k="Habitat" v={s.habitat}/>
              <DataPair k="Ketinggian" v={s.altitude}/>
              <DataPair k="Corak berbunga" v={s.phenology}/>
              {s.ecological_notes && <DataPair k="Nota ekologi" v={s.ecological_notes}/>}
            </Section>
            {s.uses && s.uses!=="—" && (
              <Section title="Kepentingan ekonomi">
                <p style={{fontSize:15,lineHeight:1.7,color:"var(--text)",margin:0}}>{s.uses}</p>
              </Section>
            )}
          </div>
          <aside>
            <div style={{padding:16,background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12}}>
              <div style={{fontSize:12,color:"var(--text-3)",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:12}}>Fakta ringkas</div>
              <Mini k="Genus" v={<span style={{fontStyle:"italic"}}>{s.genus}</span>}/>
              <Mini k="Famili" v={<span style={{fontStyle:"italic"}}>{s.family}</span>}/>
              <Mini k="Endemik" v={s.endemic?"Ya":"Tidak"}/>
              <Mini k="Taburan" v={s.distribution.length===0?"—":s.distribution.length+" kawasan"} last/>
            </div>
          </aside>
        </div>
      )}

      {tab==="taxonomy" && (
        <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12,padding:24,maxWidth:720}}>
          <h3 style={{fontSize:16,fontWeight:600,margin:"0 0 16px"}}>Pengelasan taksonomi</h3>
          {[
            ["Kingdom","Plantae"],["Clade","Tracheophytes / Angiosperms"],["Order","Malvales"],
            ["Family",s.family],["Genus",s.genus],["Species",s.sci.split(" ")[1]||"—"],
            ["Nama diterima",s.sci],
          ].map(([k,v],i)=>(
            <div key={k} style={{display:"grid",gridTemplateColumns:"180px 1fr",padding:"10px 0",borderTop:i>0?"1px solid var(--border)":"none"}}>
              <div style={{fontSize:13,color:"var(--text-2)"}}>{k}</div>
              <div style={{fontSize:14,fontStyle:["Family","Genus","Species","Nama diterima"].includes(k)?"italic":"normal"}}>{v}</div>
            </div>
          ))}
        </div>
      )}

      {tab==="distribution" && (
        <div>
          <h3 style={{fontSize:16,fontWeight:600,margin:"0 0 16px"}}>

function AdminPanel({ species, onClose, onSave, onDelete, toast }) {
  const [editing, setEditing] = useState(null);
  const [search, setSearch] = useState("");
  const [saving, setSaving] = useState(false);

  const filtered = species.filter(s =>
    s.sci.toLowerCase().includes(search.toLowerCase()) ||
    (s.common[0]||"").toLowerCase().includes(search.toLowerCase())
  );

  const handleSave = async (data) => {
    setSaving(true);
    try { await onSave(data); setEditing(null); }
    catch(e) { toast(e.message, true); }
    finally { setSaving(false); }
  };

  const handleDelete = async (id, sci) => {
    if (!confirm(`Padam "${sci}"?\nTindakan ini tidak boleh dibatalkan.`)) return;
    try { await onDelete(id); setEditing(null); toast("Rekod dipadam."); }
    catch(e) { toast(e.message, true); }
  };

  return (
    <div style={{position:"fixed",inset:0,zIndex:200,background:"rgba(0,0,0,0.5)",display:"flex",alignItems:"flex-start",justifyContent:"center",padding:24,overflowY:"auto"}}>
      <div style={{background:"var(--bg)",borderRadius:12,width:"100%",maxWidth:900,margin:"auto",border:"1px solid var(--border)",boxShadow:"0 24px 64px rgba(0,0,0,0.25)"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"18px 24px",borderBottom:"1px solid var(--border)"}}>
          <div>
            <div style={{fontWeight:600,fontSize:16}}>Panel Admin</div>
            <div style={{fontSize:12,color:"var(--text-3)",marginTop:2}}>{species.length} spesies dalam pangkalan data</div>
          </div>
          <div style={{display:"flex",gap:8}}>
            {!editing && <Btn variant="accent" size="sm" icon={<Icon.plus s={12}/>} onClick={()=>setEditing({})}>Tambah baru</Btn>}
            <Btn variant="secondary" size="sm" onClick={onClose}>Tutup</Btn>
          </div>
        </div>

        {editing ? (
          <SpeciesForm
            initial={editing._raw || editing}
            isNew={!editing.id}
            onSave={handleSave}
            onCancel={()=>setEditing(null)}
            saving={saving}
          />
        ) : (
          <div style={{padding:24}}>
            <div style={{marginBottom:16}}>
              <Input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Tapis mengikut nama…" icon={<Icon.search s={14}/>}/>
            </div>
            <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:8,overflow:"hidden"}}>
              <div style={{display:"grid",gridTemplateColumns:"1.6fr 1fr 0.8fr 70px 90px",padding:"10px 16px",borderBottom:"1px solid var(--border)",background:"var(--surface-2)",fontSize:11,fontWeight:500,color:"var(--text-3)",textTransform:"uppercase",letterSpacing:"0.04em"}}>
                <div>Nama Saintifik</div><div>Nama Melayu</div><div>Genus</div><div>Status</div><div style={{textAlign:"right"}}>Tindakan</div>
              </div>
              <div style={{maxHeight:480,overflowY:"auto"}}>
                {filtered.map((s,i)=>(
                  <div key={s.id} style={{display:"grid",gridTemplateColumns:"1.6fr 1fr 0.8fr 70px 90px",padding:"11px 16px",borderTop:i>0?"1px solid var(--border)":"none",alignItems:"center"}}>
                    <div style={{fontSize:14,fontStyle:"italic",fontWeight:500,color:"var(--text)"}}>{s.sci}</div>
                    <div style={{fontSize:13,color:"var(--text-2)"}}>{s.common[0]||"—"}</div>
                    <div style={{fontSize:13,fontStyle:"italic",color:"var(--text-2)"}}>{s.genus}</div>
                    <div><Pill status={s.iucn} size="sm"/></div>
                    <div style={{display:"flex",gap:6,justifyContent:"flex-end"}}>

// ============================================================
function Contribute({ species, toast, setRoute }) {
  const [step, setStep]     = useState(1);
  const [file, setFile]     = useState(null);
  const [preview, setPreview] = useState(null);
  const [submitting, setSub] = useState(false);
  const [form, setForm]     = useState({
    species_id: "", species_name: "", photo_type: "habit",
    contributor_name: "", contributor_email: "",
    locality: "", state: "", notes: "", agree: false,
  });
  const upd = (k,v) => setForm(p=>({...p,[k]:v}));

  const PHOTO_TYPES = ["habit","daun (leaf)","kulit (bark)","bunga (flower)","buah (fruit)","anak benih (seedling)"];
  const STATES = ["Perlis","Kedah","Pulau Pinang","Perak","Selangor","Negeri Sembilan","Melaka","Johor","Pahang","Terengganu","Kelantan","Kuala Lumpur","Sabah","Sarawak"];

  const onFile = e => {
    const f = e.target.files[0];
    if (!f) return;
    if (f.size > 10 * 1024 * 1024) { toast("Fail terlalu besar. Maksimum 10MB.", true); return; }
    setFile(f);
    const reader = new FileReader();
    reader.onload = ev => setPreview(ev.target.result);
    reader.readAsDataURL(f);
  };

  const submit = async () => {
    if (!file)                  { toast("Sila pilih gambar.", true); return; }
    if (!form.species_name)     { toast("Sila pilih spesies.", true); return; }
    if (!form.contributor_name) { toast("Sila isi nama.", true); return; }
    if (!form.agree)            { toast("Sila tandakan persetujuan.", true); return; }

    setSub(true);
    try {
      const ext   = file.name.split(".").pop();
      const fname = `submissions/${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
      const upRes = await fetch(
        `${SUPABASE_URL}/storage/v1/object/species-photos/${fname}`,
        { method:"POST", headers:{ "apikey": SUPABASE_ANON, "Authorization":`Bearer ${SUPABASE_ANON}`, "Content-Type": file.type }, body: file }
      );
      if (!upRes.ok) {
        const err = await upRes.json().catch(()=>({}));
        throw new Error(err.message || "Muat naik gambar gagal.");
      }
      const imgUrl = `${SUPABASE_URL}/storage/v1/object/public/species-photos/${fname}`;
      const subRes = await fetch(`${SUPABASE_URL}/rest/v1/photo_submissions`, {
        method:"POST",
        headers:{ "apikey":SUPABASE_ANON, "Authorization":`Bearer ${SUPABASE_ANON}`, "Content-Type":"application/json", "Prefer":"return=minimal" },
        body: JSON.stringify({
          species_id:        form.species_id || null,
          species_name:      form.species_name,
          photo_type:        form.photo_type,
          contributor_name:  form.contributor_name,
          contributor_email: form.contributor_email,
          locality:          form.locality,
          state:             form.state,
          notes:             form.notes,
          image_url:         imgUrl,
          status:            "pending",
          submitted_at:      new Date().toISOString(),
        })
      });
      if (!subRes.ok) throw new Error("Gagal menyimpan rekod.");
      setStep(2);
    } catch(e) {
      toast(e.message, true);
    } finally {
      setSub(false);
    }
  };

  const iStyle = { width:"100%", padding:"9px 12px", background:"var(--surface)", border:"1px solid var(--border-strong)", borderRadius:"var(--radius-sm)", fontSize:14, color:"var(--text)", outline:"none" };

  if (step === 2) return (
    <div style={{maxWidth:560,margin:"80px auto",textAlign:"center",padding:32}}>
      <div style={{width:56,height:56,borderRadius:999,background:"var(--accent-2)",color:"var(--accent)",margin:"0 auto 20px",display:"flex",alignItems:"center",justifyContent:"center"}}>
        <Icon.check s={22}/>
      </div>
      <h1 style={{fontSize:28,fontWeight:600,margin:"0 0 12px",letterSpacing:"-0.02em"}}>Terima kasih!</h1>
      <p style={{fontSize:15,color:"var(--text-2)",margin:"0 0 8px",lineHeight:1.6}}>
        Sumbangan anda telah diterima dan sedang menunggu semakan pentadbir.
      </p>
      <p style={{fontSize:13,color:"var(--text-3)",margin:"0 0 28px"}}>Gambar akan diterbitkan selepas disahkan.</p>
      <div style={{display:"flex",gap:8,justifyContent:"center"}}>
        <Btn variant="primary" onClick={()=>setRoute("home")}>Laman Utama</Btn>
        <Btn variant="secondary" onClick={()=>{setStep(1);setFile(null);setPreview(null);setForm({species_id:"",species_name:"",photo_type:"habit",contributor_name:"",contributor_email:"",locality:"",state:"",notes:"",agree:false});}}>Hantar Lagi</Btn>
      </div>
    </div>
  );

  return (
    <div style={{maxWidth:760,margin:"0 auto",padding:"40px 32px 64px"}}>
      <div style={{marginBottom:32}}>
        <h1 style={{fontSize:28,fontWeight:600,margin:"0 0 8px",letterSpacing:"-0.02em"}}>Sumbang Foto</h1>
        <p style={{fontSize:14,color:"var(--text-2)",margin:0}}>Kongsi gambar pokok dipterokarp anda. Disemak oleh pentadbir sebelum diterbitkan.</p>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:24}}>
        <div style={{display:"flex",flexDirection:"column",gap:16}}>
          <div>
            <div style={{fontSize:12,fontWeight:500,color:"var(--text-3)",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:8}}>Gambar *</div>
            <label style={{display:"block",cursor:"pointer"}}>
              <input type="file" accept="image/*" onChange={onFile} style={{display:"none"}}/>
              {preview ? (
                <div style={{position:"relative",borderRadius:"var(--radius)",overflow:"hidden",border:"2px solid var(--accent)"}}>
                  <img src={preview} style={{width:"100%",aspectRatio:"4/3",objectFit:"cover",display:"block"}}/>
                  <div style={{position:"absolute",bottom:8,right:8,background:"rgba(0,0,0,0.6)",color:"white",fontSize:11,padding:"4px 10px",borderRadius:999}}>Klik untuk tukar</div>
                </div>
              ) : (
                <div style={{aspectRatio:"4/3",border:"2px dashed var(--border-strong)",borderRadius:"var(--radius)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:10,color:"var(--text-3)",background:"var(--surface)",transition:"border-color .15s"}}
                  onMouseEnter={e=>e.currentTarget.style.borderColor="var(--accent)"}
                  onMouseLeave={e=>e.currentTarget.style.borderColor="var(--border-strong)"}>
                  <Icon.upload s={28}/>
                  <div style={{textAlign:"center"}}>
                    <div style={{fontSize:14,fontWeight:500,color:"var(--text-2)"}}>Klik untuk pilih gambar</div>
                    <div style={{fontSize:12,marginTop:4}}>JPG, PNG, WEBP · Maks 10MB</div>
                  </div>
                </div>
              )}
            </label>
          </div>
          <div>
            <div style={{fontSize:12,fontWeight:500,color:"var(--text-3)",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:8}}>Jenis Gambar</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
              {PHOTO_TYPES.map(t=>(
                <button key={t} onClick={()=>upd("photo_type",t)} style={{
                  padding:"6px 12px",borderRadius:999,fontSize:12,cursor:"pointer",fontWeight:500,
                  background:form.photo_type===t?"var(--text)":"var(--surface)",
                  color:form.photo_type===t?"var(--bg)":"var(--text-2)",
                  border:"1px solid "+(form.photo_type===t?"var(--text)":"var(--border-strong)"),
                }}>{t}</button>
              ))}
            </div>
          </div>
        </div>

        <div style={{display:"flex",flexDirection:"column",gap:14}}>
          <div>
            <div style={{fontSize:12,fontWeight:500,color:"var(--text-3)",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:6}}>Spesies *</div>
            <select style={iStyle} value={form.species_id}
              onChange={e=>{
                const sel = species.find(s=>s.id===e.target.value);
                upd("species_id", e.target.value);
                upd("species_name", sel?sel.sci:e.target.value);
              }}>
              <option value="">-- Pilih spesies --</option>
              {species.map(s=>(<option key={s.id} value={s.id}>{s.sci}{s.common[0]?" — "+s.common[0]:""}</option>))}
            </select>
          </div>
          <div>
            <div style={{fontSize:12,fontWeight:500,color:"var(--text-3)",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:6}}>Nama Penyumbang *</div>
            <input style={iStyle} value={form.contributor_name} placeholder="Nama anda" onChange={e=>upd("contributor_name",e.target.value)}/>
          </div>
          <div>
            <div style={{fontSize:12,fontWeight:500,color:"var(--text-3)",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:6}}>E-mel</div>
            <input style={iStyle} type="email" value={form.contributor_email} placeholder="email@contoh.com" onChange={e=>upd("contributor_email",e.target.value)}/>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <div>
              <div style={{fontSize:12,fontWeight:500,color:"var(--text-3)",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:6}}>Lokaliti</div>
              <input style={iStyle} value={form.locality} placeholder="e.g. Bukit Larut" onChange={e=>upd("locality",e.target.value)}/>
            </div>
            <div>
              <div style={{fontSize:12,fontWeight:500,color:"var(--text-3)",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:6}}>Negeri</div>
              <select style={iStyle} value={form.state} onChange={e=>upd("state",e.target.value)}>
                <option value="">-- Pilih --</option>
                {STATES.map(s=>(<option key={s}>{s}</option>))}
              </select>
            </div>
          </div>
          <div>
            <div style={{fontSize:12,fontWeight:500,color:"var(--text-3)",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:6}}>Nota Tambahan</div>
            <textarea style={{...iStyle,minHeight:72,resize:"vertical"}} value={form.notes} placeholder="Tarikh, ketinggian, keadaan cuaca…" onChange={e=>upd("notes",e.target.value)}/>
          </div>
          <label style={{display:"flex",gap:10,padding:14,border:"1px solid var(--border)",borderRadius:"var(--radius)",cursor:"pointer",alignItems:"flex-start",background:"var(--surface)"}}>
            <input type="checkbox" checked={form.agree} onChange={e=>upd("agree",e.target.checked)} style={{marginTop:2,accentColor:"var(--accent)"}}/>
            <span style={{fontSize:13,color:"var(--text-2)",lineHeight:1.5}}>
              Saya mengesahkan saya adalah pemilik gambar ini dan bersetuju untuk melesenkannya di bawah <strong>CC-BY 4.0</strong> untuk kegunaan pangkalan data ini.
            </span>
          </label>
          <Btn variant="accent" full disabled={submitting} onClick={submit}>
            {submitting ? "Menghantar…" : "Hantar untuk Semakan"}
          </Btn>
        </div>
      </div>
    </div>
  );
}

// ============================================================
// APPROVALS (Admin photo review queue)
// ============================================================
function Approvals({ toast, setRoute }) {
  const [submissions, setSubs] = useState([]);
  const [loading, setLoading]  = useState(true);
  const [filter, setFilter]    = useState("pending");

  const load = async () => {
    setLoading(true);
    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/photo_submissions?select=*&order=submitted_at.desc`,
        { headers:{ "apikey":SUPABASE_ANON, "Authorization":`Bearer ${SUPABASE_ANON}` } }
      );
      if (!res.ok) throw new Error(await res.text());
      setSubs(await res.json());
    } catch(e) { toast(e.message, true); }
    finally { setLoading(false); }
  };

  useEffect(()=>{ load(); },[]);

  const updateStatus = async (id, status, speciesId, imageUrl) => {
    try {
      await fetch(`${SUPABASE_URL}/rest/v1/photo_submissions?id=eq.${id}`, {
        method:"PATCH",
        headers:{ "apikey":SUPABASE_ANON,"Authorization":`Bearer ${SUPABASE_ANON}`,"Content-Type":"application/json" },
        body: JSON.stringify({ status, reviewed_at: new Date().toISOString() })
      });
      if (status==="approved" && speciesId && imageUrl) {
        await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?id=eq.${speciesId}`, {
          method:"PATCH",
          headers:{ "apikey":SUPABASE_ANON,"Authorization":`Bearer ${SUPABASE_ANON}`,"Content-Type":"application/json" },
          body: JSON.stringify({ image_url: imageUrl, updated_at: new Date().toISOString() })
        });
      }
      toast(status==="approved" ? "✓ Gambar diluluskan & dikemaskini." : "Gambar ditolak.");
      setSubs(prev=>prev.map(s=>s.id===id?{...s,status}:s));
    } catch(e) { toast(e.message, true); }
  };

  const shown = submissions.filter(s => filter==="all" ? true : s.status===filter);
  const pendingCount = submissions.filter(s=>s.status==="pending").length;

  return (
    <div style={{maxWidth:1100,margin:"0 auto",padding:"32px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:24}}>
        <div>
          <h1 style={{fontSize:24,fontWeight:600,margin:"0 0 4px",letterSpacing:"-0.02em"}}>Kelulusan Foto</h1>
          <p style={{fontSize:13,color:"var(--text-3)",margin:0}}>{pendingCount} menunggu semakan</p>
        </div>
        <Btn variant="secondary" size="sm" onClick={()=>setRoute("home")}>← Kembali</Btn>
      </div>
      <div style={{display:"flex",gap:8,marginBottom:20}}>
        {[["pending","Menunggu"],["approved","Diluluskan"],["rejected","Ditolak"],["all","Semua"]].map(([v,l])=>(
          <button key={v} onClick={()=>setFilter(v)} style={{
            padding:"7px 14px",borderRadius:"var(--radius-sm)",fontSize:13,fontWeight:500,cursor:"pointer",
            background:filter===v?"var(--text)":"var(--surface)",
            color:filter===v?"var(--bg)":"var(--text-2)",
            border:"1px solid "+(filter===v?"var(--text)":"var(--border-strong)"),
          }}>
            {l}
            {v==="pending" && pendingCount>0 && <span style={{marginLeft:6,background:filter==="pending"?"rgba(255,255,255,0.25)":"var(--accent-2)",color:filter==="pending"?"white":"var(--accent)",borderRadius:999,padding:"1px 7px",fontSize:11}}>{pendingCount}</span>}
          </button>
        ))}
      </div>
      {loading ? (
        <div style={{textAlign:"center",padding:64,color:"var(--text-3)"}}>
          <div style={{width:32,height:32,border:"2px solid var(--border)",borderTopColor:"var(--accent)",borderRadius:"50%",animation:"spin .8s linear infinite",margin:"0 auto 16px"}}/>
          Memuatkan…
        </div>
      ) : shown.length===0 ? (
        <div style={{textAlign:"center",padding:64,color:"var(--text-3)",background:"var(--surface)",borderRadius:12,border:"1px dashed var(--border-strong)"}}>
          Tiada sumbangan dalam kategori ini.
        </div>
      ) : (
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(320px,1fr))",gap:16}}>
          {shown.map(sub=>(
            <div key={sub.id} style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12,overflow:"hidden"}}>
              <div style={{position:"relative"}}>
                <img src={sub.image_url} style={{width:"100%",aspectRatio:"4/3",objectFit:"cover",display:"block",background:"var(--surface-2)"}}
                  onError={e=>{ e.target.style.display="none"; }}/>
                <span style={{position:"absolute",top:8,right:8,padding:"3px 10px",borderRadius:999,fontSize:11,fontWeight:600,
                  background:sub.status==="pending"?"#FEF3C7":sub.status==="approved"?"#D1FAE5":"#FEE2E2",
                  color:sub.status==="pending"?"#A16207":sub.status==="approved"?"#047857":"#B91C1C"}}>
                  {sub.status==="pending"?"Menunggu":sub.status==="approved"?"Diluluskan":"Ditolak"}
                </span>
              </div>
              <div style={{padding:14}}>
                <div style={{fontSize:14,fontWeight:500,fontStyle:"italic",marginBottom:4}}>{sub.species_name||"—"}</div>
                <div style={{fontSize:12,color:"var(--text-3)",marginBottom:8}}>{sub.photo_type} · {sub.state||"—"} {sub.locality?"· "+sub.locality:""}</div>
                <div style={{fontSize:12,color:"var(--text-2)",marginBottom:2}}>oleh {sub.contributor_name||"Tanpa nama"}</div>
                {sub.notes && <div style={{fontSize:12,color:"var(--text-3)",marginTop:6,lineHeight:1.5}}>{sub.notes}</div>}
                <div style={{fontSize:11,color:"var(--text-3)",marginTop:6,fontFamily:"var(--mono)"}}>{sub.submitted_at?.slice(0,10)||""}</div>
              </div>
              {sub.status==="pending" && (
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",borderTop:"1px solid var(--border)"}}>
                  <button onClick={()=>updateStatus(sub.id,"rejected",sub.species_id,sub.image_url)} style={{padding:"11px",background:"none",border:"none",borderRight:"1px solid var(--border)",cursor:"pointer",fontSize:13,color:"var(--danger)",fontWeight:500}}>✕ Tolak</button>
                  <button onClick={()=>updateStatus(sub.id,"approved",sub.species_id,sub.image_url)} style={{padding:"11px",background:"none",border:"none",cursor:"pointer",fontSize:13,color:"var(--accent)",fontWeight:500}}>✓ Lulus</button>
                </div>
              )}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ============================================================
// APP
// ============================================================
function App() {
  const [route, setRoute]       = useState("home");
  const [speciesId, setSpeciesId] = useState(null);
  const [query, setQuery]       = useState("");
  const [rawSpecies, setRawSpecies] = useState([]);
  const [loading, setLoading]   = useState(true);
  const [loadError, setLoadError] = useState(null);
  const [isAdmin, setIsAdmin]   = useState(false);
  const [showLogin, setShowLogin] = useState(false);
  const [showAdmin, setShowAdmin] = useState(false);
  const [toastMsg, setToastMsg] = useState(null);
  const [toastErr, setToastErr] = useState(false);
  const toastTimer = useRef(null);

  const toast = useCallback((msg, isError=false) => {
    setToastMsg(msg); setToastErr(isError);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(()=>setToastMsg(null), 3000);
  }, []);

  const species = useMemo(()=>rawSpecies.map(mapRow),[rawSpecies]);

  useEffect(()=>{
    dbGet()
      .then(data=>{ setRawSpecies(data); setLoading(false); })
      .catch(e=>{ setLoadError(e.message); setLoading(false); });
  },[]);

  useEffect(()=>{ window.scrollTo({top:0}); },[route,speciesId]);

  const onSearch = () => setRoute("browse");

  const handleSave = async (formData) => {
    const payload = { ...formData };
    delete payload.id;
    payload.updated_at = new Date().toISOString();
    if (formData.id) {
      await dbUpdate(formData.id, payload);
      setRawSpecies(prev=>prev.map(s=>s.id===formData.id?{...s,...payload}:s));
      toast("✓ Rekod dikemaskini.");
    } else {
      payload.created_at = new Date().toISOString();
      const res = await dbInsert(payload);
      setRawSpecies(prev=>[...(res[0]?[res[0]]:prev), ...prev]);
      toast("✓ Spesies baru ditambah.");
    }
  };

  const handleDelete = async (id) => {
    await dbDelete(id);
    setRawSpecies(prev=>prev.filter(s=>s.id!==id));
    toast("Rekod dipadam.");
  };

  return (
    <>
      <style>{`@keyframes spin{to{transform:rotate(360deg)}} @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}`}</style>

      <TopBar
        route={route} setRoute={setRoute}
        query={query} setQuery={setQuery}
        onSearch={onSearch}
        isAdmin={isAdmin}
        setShowLogin={setShowLogin}
        setShowAdmin={setShowAdmin}
      />

      <main style={{minHeight:"calc(100vh - 64px)"}}>
        {loadError && (
          <div style={{maxWidth:600,margin:"80px auto",padding:32,textAlign:"center",background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12}}>
            <div style={{fontSize:16,fontWeight:600,marginBottom:8}}>Gagal memuatkan data</div>
            <div style={{fontSize:13,color:"var(--text-2)",marginBottom:16,fontFamily:"var(--mono)"}}>{loadError}</div>
            <p style={{fontSize:13,color:"var(--text-3)"}}>Sila periksa konfigurasi SUPABASE_ANON di baris atas fail HTML ini.</p>
          </div>
        )}
        {!loadError && route==="home"   && <Home species={species} loading={loading} setRoute={setRoute} setSpeciesId={setSpeciesId} setQuery={setQuery} onSearch={onSearch}/>}
        {!loadError && route==="browse" && <Browse species={species} query={query} setQuery={setQuery} setRoute={setRoute} setSpeciesId={setSpeciesId}/>}
        {!loadError && route==="detail" && <Detail species={species} speciesId={speciesId} setSpeciesId={setSpeciesId} setRoute={setRoute} setQuery={setQuery}/>}
        {route==="about" && <About/>}
        {route==="contribute" && <Contribute species={species} toast={toast} setRoute={setRoute}/>}
        {isAdmin && route==="approvals" && <Approvals toast={toast} setRoute={setRoute}/>}
      </main>

      <footer style={{borderTop:"1px solid var(--border)",padding:"32px",marginTop:48}}>
        <div style={{maxWidth:1280,margin:"0 auto",display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:16,fontSize:13,color:"var(--text-2)"}}>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <div style={{width:22,height:22,borderRadius:6,background:"var(--accent)",display:"inline-flex",alignItems:"center",justifyContent:"center",color:"white"}}><Icon.leaf s={13}/></div>
            <span style={{fontWeight:500,color:"var(--text)"}}>Dipterokarp Malaysia</span>
            <span style={{color:"var(--text-3)"}}>· Dipterocarpaceae Database</span>
          </div>
          <div style={{fontFamily:"var(--mono)",fontSize:12,color:"var(--text-3)"}}>v1.0 · CC-BY 4.0 · 2025–2026</div>
        </div>
      </footer>

      {showLogin && <LoginModal onLogin={()=>{setIsAdmin(true);setShowLogin(false);setShowAdmin(true);toast("Selamat datang, Admin!");}} onClose={()=>setShowLogin(false)}/>}
      {showAdmin && isAdmin && <AdminPanel species={species} onClose={()=>setShowAdmin(false)} onSave={handleSave} onDelete={handleDelete} toast={toast}/>}
      {toastMsg && <Toast msg={toastMsg} isError={toastErr}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
